<style>:root{--bg:#f7f7f4;--c:#fff;--i:#1f2933;--m:#64748b;--l:#e2e8f0;--a:#0f766e}@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--c:#1e293b;--i:#e2e8f0;--m:#94a3b8;--l:#334155}}

<h1 id="hd">📘 CCE</h1><div id="d"><div class="card">लोड होत आहे…</div></div>
<script>
var E=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var T='',NM='';try{T=sessionStorage.getItem('am_t')||'';NM=sessionStorage.getItem('am_tn')||''}catch(e){}
var H=decodeURIComponent(location.hash.slice(1)).split(','),UD=H[0]||'',CL=parseInt(H[1])||0,DV=H[2]||'A';
var now=new Date(),y0=now.getMonth()>=5?now.getFullYear():now.getFullYear()-1,YR=y0+'-'+String((y0+1)%100).padStart(2,'0');
var d=document.getElementById('d'),DOC={};
/* साधने: ८ आकारिक + ३ संकलित */
var CP=['निरीक्षण','तोंडी काम','प्रात्यक्षिक','उपक्रम','प्रकल्प','चाचणी','स्वाध्याय','इतर साधने','तोंडी','प्रात्यक्षिक','लेखी'];
/* डिफॉल्ट भारांश (दोन्ही सत्रांसाठी समान). _ = लागू नाही */
var _=null,WK=[_,_,20,60,_,_,20,_,_,_,_],A1=[_,20,60,20,_,_,_,_,_,_,_],A2=[10,10,40,20,_,20,_,_,_,_,_];
function sb(l,w,names){return names.map(function(n){return [n[0],n[1],n[0]==='LANG'?l:w]})}
var M12=[_,10,10,20,_,20,10,_,10,_,20],M34=[_,10,10,10,_,20,10,_,10,_,30],M56=[_,5,10,10,_,20,5,_,10,_,40],M78=[_,5,5,5,_,20,5,_,10,_,50];
var L12=[_,10,10,10,10,20,10,_,10,_,20],L34=[_,10,10,5,5,20,10,_,10,_,30],L56=[_,5,10,0,5,20,10,_,10,_,40],L78=[_,5,10,_,5,20,_,_,10,_,50];
var B=[['LANG','भाषा'],['MATH','गणित'],['ENG','इंग्रजी']],PE=['PE','शारीरिक शिक्षण',WK],WO=['WORK','कार्यशिक्षण',WK];
var W={1:sb(L12,M12,B).concat([['ART','कला',A1],WO,PE])};W[2]=W[1];
W[3]=sb(L34,M34,B.concat([['EVS1','आपल्या सभोवतालचे जग भाग 1'],['EVS2','आपल्या सभोवतालचे जग भाग 2']])).concat([['ART','कला',A2],WO,PE]);W[4]=W[3];
W[5]=sb(L56,M56,B.concat([['EVS1','परिसर अभ्यास भाग 1'],['EVS2','परिसर अभ्यास भाग 2'],['HINDI','हिंदी / हिंदी-मराठी']])).concat([['ART','कला',A1],WO,PE]);
W[6]=sb(L56,M56,B.concat([['HINDI','हिंदी / हिंदी-मराठी'],['SOC','सामाजिक शास्त्र'],['SCI','सामान्य विज्ञान']])).concat([['ART','कला',A2],['VOC','व्यावसायिक शिक्षण',[_,_,10,15,30,25,_,20,_,_,_]],PE]);
W[7]=sb(L78,M78,B.concat([['HINDI','हिंदी / हिंदी-मराठी'],['SOC','समाजशास्त्र'],['SCI','विज्ञान']])).concat([['ART','कला',A1],['WORK','कार्यअनुभव',WK],PE]);W[8]=W[7];
var MON=['जून','जुलै','ऑगस्ट','सप्टेंबर','ऑक्टोबर','नोव्हेंबर','डिसेंबर','जानेवारी','फेब्रुवारी','मार्च','एप्रिल','मे'];
function post(u,b){b.token=T;b.udise=UD;b.yr=YR;if(b.cls===undefined){b.cls=CL;b.div=DV}return fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json()})}
function key(c,kind,k){return c+'|'+kind+'|'+k}
function get(c,kind,k){var x=DOC[key(c,kind,k)];return x?x.v:null}
function put(c,kind,k,v){var kk=key(c,kind,k),b={kind:kind,k:k,v:v};if(c===0){b.cls=0;b.div=''}if(DOC[kk])b.upd=DOC[kk].upd;
 return post('/api/cce/put',b).then(function(j){if(j.ok)DOC[kk]={v:v,upd:j.upd};return j})}
function msg(j){return j.ok?'':j.e==='conflict'?'दुसऱ्या कोणीतरी ही माहिती बदलली आहे. पान रिफ्रेश करून पुन्हा भरा.':j.e==='auth'?'सत्र संपले. शिक्षक पानावरून पुन्हा लॉगिन करा.':'सेव्ह झाले नाही. इंटरनेट तपासा.'}
function back(t){return '<button class="g" onclick="home()">← CCE</button><h2 style="margin:4px 0 12px">'+t+'</h2>'}
function load(){if(!T||!/^\d{11}$/.test(UD)||!CL){d.innerHTML='<div class="card">कृपया शिक्षक पानावरून लॉगिन करून वर्ग निवडा.<br><br><button onclick="location.href=\'teacher.html\'">शिक्षक पान</button></div>';return}
 document.getElementById('hd').textContent='📘 CCE — इयत्ता '+CL+' '+DV+' ('+YR+')';
 post('/api/cce/get',{school:1,kinds:['set','wt','wtdone','days']}).then(function(j){if(!j.ok){d.innerHTML='<div class="card er">'+msg(j)+'<br><br><button onclick="location.href=\'teacher.html\'">शिक्षक पान</button></div>';return}
  j.rows.forEach(function(r){var v=null;try{v=JSON.parse(r.v)}catch(e){}DOC[key(r.cls,r.kind,r.k)]={v:v,upd:r.upd}});home()}).catch(function(){d.innerHTML='<div class="card er">इंटरनेट तपासा.</div>'})}
function tile(ic,t,s,fn,done){return '<div class="card t'+(fn?'':' off')+'"'+(fn?' onclick="'+fn+'"':'')+'><span class="ic">'+ic+'</span><span><b>'+t+(done?' ✔':'')+'</b><small>'+s+'</small></span></div>'}
function home(){var s0=get(0,'set',''),s1=get(CL,'set',''),dy=get(0,'days','');
 d.innerHTML='<button class="g" onclick="location.href=\'teacher.html\'">← वर्ग</button>'+
 tile('🏫','शाळा व वर्गशिक्षक','मुख्याध्यापक आणि वर्गशिक्षकाचे नाव','setS()',s0&&s1)+
 tile('⚖️','भारांश','दोन्ही सत्रांचा भारांश निश्चित केल्यावरच गुण नोंदणी सुरू होते','wtS(1)',get(CL,'wtdone','1')&&get(CL,'wtdone','2'))+
 tile('📅','कामाचे दिवस','महिनावार शाळेचे कामाचे दिवस','dayS()',dy)+
 tile('✏️','गुण नोंदणी','विषयवार, साधनवार गुण भरा','mkS(1)')+tile('🙋','उपस्थिती','महिनावार उपस्थित दिवस','atS(0)',get(CL,'att','all'))+tile('⚖️','आरोग्य (वजन/उंची)','सत्र १ व सत्र २','hlS(1)',get(CL,'hlt','1')&&get(CL,'hlt','2'))+tile('📝','वर्णनात्मक नोंदी','लवकरच','')+tile('📄','निकाल व प्रगती पुस्तिका','लवकरच','')}
/* ---- शाळा व वर्गशिक्षक ---- */
function setS(){var s0=get(0,'set','')||{},s1=get(CL,'set','')||{};
 d.innerHTML=back('शाळा व वर्गशिक्षक')+'<div class="card"><label>शाळेचे नाव</label><input id="sn" value="'+E(s0.school||'')+'"><label>मुख्याध्यापकाचे नाव</label><input id="hm" value="'+E(s0.hm||'')+'"><label>इयत्ता '+CL+' '+E(DV)+' — वर्गशिक्षकाचे नाव</label><input id="ct" value="'+E(s1.ct||NM)+'"><p id="e" class="er"></p><button onclick="setSave()">सेव्ह</button></div>'}
function setSave(){var e=document.getElementById('e');if(!hm.value.trim()||!ct.value.trim()){e.textContent='दोन्ही नावे भरा.';return}e.className='ok';e.textContent='सेव्ह होत आहे…';
 put(0,'set','',{school:sn.value.trim(),hm:hm.value.trim()}).then(function(j){if(!j.ok)throw j;return put(CL,'set','',{ct:ct.value.trim()})}).then(function(j){if(!j.ok)throw j;home()}).catch(function(j){e.className='er';e.textContent=msg(j||{})})}
/* ---- भारांश ---- */
function wOf(term,code){var o=get(CL,'wt',String(term))||{};if(o[code])return o[code];var s=W[CL].filter(function(x){return x[0]===code})[0];return s?s[2]:[]}
function tot(w,a,b){var t=0;for(var i=a;i<b;i++)t+=Number(w[i])||0;return t}
function wtS(term){needMk(function(){wtS2(term)})}
function wtS2(term){var o=get(CL,'wt',String(term))||{},dn=get(CL,'wtdone',String(term));
 d.innerHTML=back('भारांश')+'<div class="r"><button class="'+(term===1?'s':'g')+'" onclick="wtS(1)">सत्र १</button><button class="'+(term===2?'s':'g')+'" onclick="wtS(2)">सत्र २</button></div><div class="card"><small>विषयावर दाबून गुण बदला. बदल न केल्यास शासनाचा डिफॉल्ट भारांश लागू राहतो.</small>'+
 W[CL].map(function(s){var w=wOf(term,s[0]);return '<div class="row" onclick="wtE('+term+',\''+s[0]+'\')"><span><b>'+E(s[1])+'</b>'+(o[s[0]]?' <small>(बदललेला)</small>':'')+'</span><small>आकारिक '+tot(w,0,8)+' + संकलित '+tot(w,8,11)+' = '+tot(w,0,11)+' ›</small></div>'}).join('')+'</div>'+(dn?'<div class="card"><b class="ok">✔ सत्र '+term+' भारांश निश्चित आहे.</b><br><small>आता गुण नोंदणी करता येते. गुण भरलेल्या विषयाचा भारांश बदलता येत नाही.</small></div>':'<div class="card"><small>सर्व विषयांचा भारांश तपासा (हवा तो बदला). तो बरोबर असेल तेव्हा खालील बटन दाबा. त्यानंतरच या सत्राची गुण नोंदणी सुरू होईल.</small><p id="e" class="er"></p><button onclick="wtDone('+term+')">✔ सत्र '+term+' भारांश निश्चित करा</button></div>')}
function wtDone(term){var e=document.getElementById('e');e.className='ok';e.textContent='सेव्ह होत आहे…';put(CL,'wtdone',String(term),1).then(function(j){if(j.ok)wtS(term);else{e.className='er';e.textContent=msg(j)}}).catch(function(){e.className='er';e.textContent=msg({})})}
function wtE(term,code){var s=W[CL].filter(function(x){return x[0]===code})[0],w=wOf(term,code),mm=get(CL,'marks',term+'|'+code),has=false;if(mm)for(var p in mm)if(mm[p]&&mm[p].some(function(x){return x!=null}))has=true;
 if(has){alert('या विषयाचे गुण आधीच भरलेले आहेत, म्हणून भारांश बदलता येत नाही.');return}
 function inp(i){return '<div><label>'+CP[i]+'</label><input type="number" inputmode="numeric" min="0" max="100" id="w'+i+'" value="'+(w[i]==null?'':w[i])+'" oninput="wtT()"></div>'}
 d.innerHTML='<button class="g" onclick="wtS('+term+')">← भारांश</button><h2 style="margin:4px 0 12px">'+E(s[1])+' — सत्र '+term+'</h2><div class="card"><h2>आकारिक</h2><div class="g2">'+[0,1,2,3,4,5,6,7].map(inp).join('')+'</div><h2 style="margin-top:12px">संकलित</h2><div class="g2">'+[8,9,10].map(inp).join('')+'</div>'+
 '<div class="sum"><span>आकारिक <span id="tf"></span> + संकलित <span id="ts"></span></span><span>एकूण <span id="tt"></span></span></div><small>रिकामे = ते साधन लागू नाही.</small><p id="e" class="er"></p><button onclick="wtSave('+term+',\''+code+'\')">सेव्ह</button><button class="g" onclick="wtDef('+term+',\''+code+'\')">डिफॉल्ट भारांश वापरा</button></div>';wtT()}
function wtV(){var w=[];for(var i=0;i<11;i++){var x=document.getElementById('w'+i).value.trim();w.push(x===''?null:Math.max(0,Number(x)||0))}return w}
function wtT(){var w=wtV();tf.textContent=tot(w,0,8);ts.textContent=tot(w,8,11);tt.textContent=tot(w,0,11);tt.style.color=tot(w,0,11)===100?'':'#b91c1c'}
function wtPut(term,code,w){var o=JSON.parse(JSON.stringify(get(CL,'wt',String(term))||{}));if(w)o[code]=w;else delete o[code];var e=document.getElementById('e');e.className='ok';e.textContent='सेव्ह होत आहे…';
 put(CL,'wt',String(term),o).then(function(j){if(j.ok)wtS(term);else{e.className='er';e.textContent=msg(j)}}).catch(function(){e.className='er';e.textContent=msg({})})}
function wtSave(term,code){var w=wtV();if(tot(w,0,11)!==100){e.className='er';e.textContent='एकूण गुण १०० हवेत (आता '+tot(w,0,11)+').';return}wtPut(term,code,w)}
function wtDef(term,code){wtPut(term,code,null)}
/* ---- कामाचे दिवस ---- */
function dayS(){var v=get(0,'days','')||[];
 d.innerHTML=back('कामाचे दिवस ('+YR+')')+'<div class="card"><small>ही माहिती पूर्ण शाळेसाठी एकदाच भरायची आहे.</small><div class="g2" style="margin-top:8px">'+MON.map(function(m,i){return '<div><label>'+m+'</label><input type="number" inputmode="numeric" min="0" max="31" id="m'+i+'" value="'+(v[i]==null?'':v[i])+'" oninput="dayT()"></div>'}).join('')+'</div><div class="sum"><span>एकूण दिवस</span><span id="dt"></span></div><p id="e" class="er"></p><button onclick="daySave()">सेव्ह</button></div>';dayT()}
function dayV(){var a=[];for(var i=0;i<12;i++){var x=document.getElementById('m'+i).value.trim();a.push(x===''?null:Math.min(31,Math.max(0,parseInt(x)||0)))}return a}
function dayT(){dt.textContent=dayV().reduce(function(s,x){return s+(x||0)},0)}
function daySave(){var e=document.getElementById('e');e.className='ok';e.textContent='सेव्ह होत आहे…';put(0,'days','',dayV()).then(function(j){if(j.ok)home();else{e.className='er';e.textContent=msg(j)}}).catch(function(){e.className='er';e.textContent=msg({})})}
/* ---- गुण नोंदणी ---- */
var STU=null,MK=false,CUR=null;
function needStu(cb){if(STU)return cb();post('/api/t/sget',{}).then(function(j){if(!j.ok){d.innerHTML=back('गुण नोंदणी')+'<div class="card er">'+msg(j)+'</div>';return}
 STU=j.rows.sort(function(a,b){var x=parseInt(a.roll)||9999,y=parseInt(b.roll)||9999;return x-y||String(a.name).localeCompare(String(b.name))});cb()}).catch(function(){d.innerHTML=back('गुण नोंदणी')+'<div class="card er">इंटरनेट तपासा.</div>'})}
function needMk(cb){if(MK)return cb();post('/api/cce/get',{kinds:['marks']}).then(function(j){if(!j.ok){d.innerHTML=back('गुण नोंदणी')+'<div class="card er">'+msg(j)+'</div>';return}
 j.rows.forEach(function(r){var v=null;try{v=JSON.parse(r.v)}catch(e){}DOC[key(r.cls,r.kind,r.k)]={v:v,upd:r.upd}});MK=true;cb()}).catch(function(){d.innerHTML=back('गुण नोंदणी')+'<div class="card er">इंटरनेट तपासा.</div>'})}
function comps(w){var a=[];for(var i=0;i<11;i++)if(w[i]>0)a.push(i);return a}
function filled(m,pen,cs){var r=m&&m[pen];if(!r)return 0;var n=0;cs.forEach(function(i){if(r[i]!=null)n++});return n}
function mkS(term){if(!get(CL,'wtdone',String(term))){d.innerHTML=back('गुण नोंदणी')+'<div class="r"><button class="'+(term===1?'s':'g')+'" onclick="mkS(1)">सत्र १</button><button class="'+(term===2?'s':'g')+'" onclick="mkS(2)">सत्र २</button></div><div class="card"><b>प्रथम सत्र '+term+' चा भारांश निश्चित करा.</b><br><small>भारांश पूर्ण झाल्यानंतरच गुण नोंदणी करता येते.</small><br><br><button onclick="wtS('+term+')">⚖️ भारांशाकडे जा</button></div>';return}
 d.innerHTML=back('गुण नोंदणी')+'<div class="card">लोड होत आहे…</div>';needStu(function(){needMk(function(){
 if(!STU.length){d.innerHTML=back('गुण नोंदणी')+'<div class="card">या वर्गात अजून विद्यार्थी नाहीत. शिक्षक पानावर "➕ विद्यार्थी जोडा" मधून आधी विद्यार्थी जोडा.</div>';return}
 d.innerHTML=back('गुण नोंदणी')+'<div class="r"><button class="'+(term===1?'s':'g')+'" onclick="mkS(1)">सत्र १</button><button class="'+(term===2?'s':'g')+'" onclick="mkS(2)">सत्र २</button></div><div class="card"><small>विषय निवडा. विद्यार्थी: '+STU.length+'</small>'+
 W[CL].map(function(s){var cs=comps(wOf(term,s[0])),m=get(CL,'marks',term+'|'+s[0]),full=0,part=0;STU.forEach(function(x){var f=filled(m,x.pen,cs);if(f===cs.length)full++;else if(f)part++});
  return '<div class="row" onclick="mkE('+term+',\''+s[0]+'\')"><b>'+E(s[1])+'</b><small>'+(full===STU.length?'✔ पूर्ण':full||part?(full+' पूर्ण'+(part?', '+part+' अपूर्ण':'')):'—')+' ›</small></div>'}).join('')+'</div>'})})}
