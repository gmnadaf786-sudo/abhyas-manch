<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>अभ्यास मंच – केंद्रप्रमुख / BEO</title>
<style>:root{--bg:#f7f7f4;--c:#fff;--i:#1f2933;--m:#64748b;--l:#e2e8f0;--a:#0f766e}@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--c:#1e293b;--i:#e2e8f0;--m:#94a3b8;--l:#334155}}
body{margin:0;background:var(--bg);color:var(--i);font:15px/1.5 system-ui,sans-serif}main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:14px;margin-bottom:14px}h1{font-size:20px;margin:6px 0 12px}h2{font-size:16px;margin:0 0 8px}
input,select,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--l);background:var(--c);color:var(--i);width:100%;box-sizing:border-box;margin-bottom:8px}
button{background:var(--a);color:#fff;border:0;cursor:pointer}button.g{background:var(--c);color:var(--a);border:1px solid var(--a)}
.er{color:#b91c1c;min-height:18px}small,.m{color:var(--m)}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1;min-width:150px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}.kp div{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:10px}.kp b{font-size:22px;display:block}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--l);text-align:left;vertical-align:top}th{color:var(--m);font-weight:600}.w{overflow-x:auto}a{color:var(--a)}.ok{color:#15803d;font-weight:600}.no{color:#b91c1c}</style></head><body><main>
<h1>🏢 अभ्यास मंच – केंद्रप्रमुख / BEO</h1><div id="x"></div></main>
<script>
var X=document.getElementById('x'),T='',U='',LB='',ROLE='',DATA=null,SF=null,CEN={},FL='',TAB='S',TD=null,TQ='',TS='';

function sg(k){try{return sessionStorage.getItem(k)||''}catch(e){return ''}}function ss(k,v){try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}}
function api(u,b){b=b||{};b.token=T;b.u=U;return fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json().then(function(j){j.$s=r.status;return j})}).catch(function(){return{e:'net'}})}
function loginUi(m){X.innerHTML='<div class="card"><h2>लॉगिन</h2><input id="u" placeholder="केंद्र कोड (उदा. CLU3603591) किंवा BEO" autocapitalize="characters"><input id="p" type="password" placeholder="पासवर्ड"><p id="e" class="er">'+esc(m||'')+'</p><button onclick="login()">लॉगिन करा</button><p class="m" style="font-size:13px">केंद्रप्रमुख: आपल्या केंद्राचा कोड. BEO: <b>BEO</b>. सुरुवातीचा पासवर्ड 123456; नंतर बदलता येतो. पासवर्ड विसरल्यास प्रशासकाकडून रीसेट करा.</p></div>'}
function login(){var u=document.getElementById('u').value.trim(),p=document.getElementById('p').value;if(!u||!p){e.textContent='कोड व पासवर्ड टाका.';return}e.textContent='…';U=u;api('/api/o/login',{u:u,pw:p}).then(function(j){if(!j.ok){e.textContent=j.e==='locked'?'खाते लॉक झाले; प्रशासकाशी संपर्क करा.':'कोड किंवा पासवर्ड चुकीचा.';return}T=j.token;U=j.u;LB=j.label;ROLE=j.role;ss('o_t',T);ss('o_u',U);ss('o_l',LB);ss('o_r',ROLE);if(!j.changed&&false){}load()})}
function out(){ss('o_t',null);ss('o_u',null);ss('o_l',null);ss('o_r',null);T='';DATA=null;loginUi()}
function chpwUi(){X.innerHTML='<button class="g" onclick="draw()">← मागे</button><div class="card"><h2>पासवर्ड बदला</h2><input id="o" type="password" placeholder="सध्याचा पासवर्ड"><input id="n1" type="password" placeholder="नवीन पासवर्ड (किमान ६ अक्षरे)"><input id="n2" type="password" placeholder="नवीन पासवर्ड पुन्हा"><p id="e" class="er"></p><button onclick="chpw()">जतन करा</button></div>'}
function chpw(){var a=o.value,b=n1.value,c=n2.value;if(b.length<6||b==='123456'){e.textContent='पासवर्ड किमान ६ अक्षरे व 123456 नसावा.';return}if(b!==c){e.textContent='दोन्ही पासवर्ड जुळत नाहीत.';return}api('/api/o/chpw',{old:a,nw:b}).then(function(j){if(j.ok)draw('✓ पासवर्ड बदलला.');else e.textContent='सध्याचा पासवर्ड चुकीचा.'})}
function load(){X.innerHTML='<p class="m">लोड होत आहे…</p>';api('/api/o/sum',{}).then(function(j){if(!j.ok){if(j.$s===401){loginUi('पुन्हा लॉगिन करा.');return}X.innerHTML='<div class="card"><p class="er">लोड झाले नाही.</p><button onclick="load()">पुन्हा</button></div>';return}DATA=j.rows;CEN=j.cen||{};ROLE=j.role;draw()})}
function tot(R){var t={s:R.length,sub:0,st:0,ro:0,uni:0,book:0,shoe:0,bag:0,pm:0};R.forEach(function(r){if(r.fs)t.sub++;if(r.fn)t.st++;t.ro+=r.n;t.uni+=r.uni;t.book+=r.book;t.shoe+=r.shoe;t.bag+=r.bag;if(r.pm)t.pm++});return t}
function dl(g,n){return n?'<span class="'+(g>=n?'ok':'')+'">'+g+'/'+n+'</span>':'<span class="m">—</span>'}
function pmD(d){return d?d.split('-').reverse().join('/'):'<span class="no">—</span>'}
function tabs(){return '<div class="row" style="margin-bottom:10px"><button class="'+(TAB==='S'?'':'g')+'" onclick="TAB=\'S\';draw()">🏫 शाळा माहिती</button><button class="'+(TAB==='T'?'':'g')+'" onclick="goT()">👨‍🏫 शिक्षक माहिती</button></div>'}
function goT(){TAB='T';if(TD){draw();return}X.innerHTML='<p class="m">लोड होत आहे…</p>';api('/api/o/teachers',{}).then(function(j){if(!j.ok){X.innerHTML='<div class="card"><p class="er">लोड झाले नाही.</p><button onclick="TAB=\'S\';draw()">मागे</button></div>';return}TD=j.rows;draw()})}
function drawT(h0){var kp=ROLE==='KP',R=TD.filter(function(r){return (!FL||r.c===FL)&&(!TS||r.u===TS)&&(!TQ||(r.n+' '+r.sh+' '+r.m).toLowerCase().indexOf(TQ.toLowerCase())>=0)}),ap=R.filter(function(r){return r.st==='ok'}).length,pe=R.filter(function(r){return r.st==='pending'}).length,cf=R.filter(function(r){return r.cf}).length,sl={};DATA.forEach(function(r){if(!FL||r.c===FL)sl[r.u]=r.nm});
 var h=h0+tabs();if(!kp)h+='<select onchange="FL=this.value;TS=\'\';draw()"><option value="">सर्व केंद्रे</option>'+Object.keys(CEN).filter(function(c){return DATA.some(function(r){return r.c===c})}).map(function(c){return '<option value="'+c+'"'+(c===FL?' selected':'')+'>'+esc(CEN[c])+'</option>'}).join('')+'</select>';
 h+='<select onchange="TS=this.value;draw()"><option value="">सर्व शाळा</option>'+Object.keys(sl).map(function(u){return '<option value="'+u+'"'+(u===TS?' selected':'')+'>'+esc(sl[u]||u)+'</option>'}).join('')+'</select><input placeholder="नाव / शालार्थ ID / मोबाईल शोधा" value="'+esc(TQ)+'" onchange="TQ=this.value;draw()"><div class="kp"><div><small>एकूण शिक्षक</small><b>'+R.length+'</b></div><div><small>मंजूर</small><b>'+ap+'</b></div><div><small>प्रलंबित</small><b>'+pe+'</b></div><div><small>ॲपमध्ये पक्की नोंदणी</small><b>'+cf+'</b></div></div><div class="row"><button class="g" onclick="csvT()">⬇ शिक्षक यादी CSV</button><button class="g" onclick="window.print()">🖨 प्रिंट</button></div><div class="card"><div class="w"><table><tr><th>#</th><th>शिक्षक</th><th>शालार्थ ID</th><th>मोबाईल</th><th>शाळा</th><th>स्थिती</th></tr>'+R.map(function(r,i){return '<tr><td>'+(i+1)+'</td><td><a href="#" onclick="tview(\''+esc(r.sh)+'\');return false">'+esc(r.n)+'</a></td><td>'+esc(r.sh)+'</td><td>'+esc(r.m)+'</td><td>'+esc(r.sc||r.u)+'</td><td>'+(r.st==='ok'?'<span class="ok">मंजूर</span>':'<span class="no">प्रलंबित</span>')+(r.cf?' ✔':'')+'</td></tr>'}).join('')+'</table></div></div><div id="tv"></div>';X.innerHTML=h}
var TF=null;
function tview(sh){var v=document.getElementById('tv');v.innerHTML='<p class="m">…</p>';Promise.all([TF?TF:fetch('/data/teacherform.json').then(function(r){return r.json()}),api('/api/o/tinfo',{sh:sh})]).then(function(a){TF=a[0];var j=a[1];if(!j.ok){v.innerHTML='<div class="card"><p class="er">माहिती मिळाली नाही.</p></div>';return}var o={};try{o=JSON.parse(j.data||'{}')}catch(e){}var h='<div class="card" id="tp"><h2>'+esc(o['मराठीत पूर्ण नाव']||j.name)+'</h2><p class="m">शालार्थ ID: '+esc(sh)+' · '+esc(j.sc||j.udise)+(j.upd?' · माहिती दिनांक '+esc(j.upd):'')+'</p>';if(!j.data){h+='<p class="m">या शिक्षकाची सविस्तर माहिती अजून आयात केलेली नाही.</p>'}else{var S={};TF.forEach(function(f){if(o[f.h]==null||o[f.h]==='')return;var a=S[f.s]=S[f.s]||{};(a[f.b]=a[f.b]||[]).push([f.h,o[f.h]])});Object.keys(S).sort().forEach(function(s){h+='<h3 style="margin:14px 0 4px;font-size:15px">'+esc(s)+'</h3>';Object.keys(S[s]).forEach(function(b){h+='<div class="w"><table><tr><th colspan="2">'+esc(b)+'</th></tr>'+S[s][b].map(function(x){return '<tr><td style="width:45%">'+esc(x[0])+'</td><td>'+esc(x[1])+'</td></tr>'}).join('')+'</table></div>'})})}h+='<div class="row"><button class="g" onclick="window.print()">🖨 प्रिंट</button><button class="g" onclick="document.getElementById(\'tv\').innerHTML=\'\'">बंद करा</button></div></div>';v.innerHTML=h;v.scrollIntoView()})}
function csvT(){var R=TD.filter(function(r){return (!FL||r.c===FL)&&(!TS||r.u===TS)});save('shikshak_yadi.csv',[['शिक्षक','शालार्थ ID','मोबाईल','UDISE','शाळा','केंद्र','स्थिती','पक्की नोंदणी']].concat(R.map(function(r){return [r.n,r.sh,r.m,r.u,r.sc,CEN[r.c]||'',r.st==='ok'?'मंजूर':'प्रलंबित',r.cf?'होय':'']})))}
function draw(msg){if(TAB==='T'&&TD){drawT('<div class="card"><b>'+esc(LB)+'</b> <button class="g" style="width:auto;float:right;margin:0" onclick="out()">बाहेर पडा</button></div>');return}var R=DATA.filter(function(r){return !FL||r.c===FL}),t=tot(R),kp=ROLE==='KP',cs=Object.keys(CEN).filter(function(c){return DATA.some(function(r){return r.c===c})});
 var h='<div class="card"><b>'+esc(LB)+'</b> <button class="g" style="width:auto;float:right;margin:0" onclick="out()">बाहेर पडा</button><button class="g" style="width:auto;float:right;margin:0 6px 0 0" onclick="chpwUi()">🔑</button><p class="m" style="margin:6px 0 0">'+esc(msg||'')+'</p></div>'+tabs();
 if(!kp)h+='<select onchange="FL=this.value;draw()"><option value="">सर्व केंद्रे ('+DATA.length+' शाळा)</option>'+cs.map(function(c){return '<option value="'+c+'"'+(c===FL?' selected':'')+'>'+esc(CEN[c])+' ('+DATA.filter(function(r){return r.c===c}).length+')</option>'}).join('')+'</select>';
 h+='<div class="kp"><div><small>शाळा</small><b>'+t.s+'</b></div><div><small>माहिती सादर</small><b>'+t.sub+'</b><small>सुरू केलेली '+t.st+'</small></div><div><small>विद्यार्थी (यादीत)</small><b>'+t.ro+'</b></div><div><small>गणवेश</small><b>'+t.uni+'</b></div><div><small>पुस्तके</small><b>'+t.book+'</b></div><div><small>बूट-मोजे</small><b>'+t.shoe+'</b></div><div><small>दप्तर</small><b>'+t.bag+'</b></div><div><small>PM नोंद असलेल्या शाळा</small><b>'+t.pm+'</b></div></div>';
 if(!kp&&!FL){h+='<div class="card"><h2>केंद्रनिहाय सारांश</h2><div class="w"><table><tr><th>केंद्र</th><th>शाळा</th><th>माहिती सादर</th><th>सुरू केलेली</th><th>विद्यार्थी</th><th>गणवेश</th><th>पुस्तके</th><th>बूट-मोजे</th><th>दप्तर</th></tr>'+cs.map(function(c){var q=tot(DATA.filter(function(r){return r.c===c}));return '<tr><td><a href="#" onclick="FL=\''+c+'\';draw();return false">'+esc(CEN[c])+'</a></td><td>'+q.s+'</td><td>'+q.sub+'</td><td>'+q.st+'</td><td>'+q.ro+'</td><td>'+q.uni+'</td><td>'+q.book+'</td><td>'+q.shoe+'</td><td>'+q.bag+'</td></tr>'}).join('')+'</table></div></div>'}
 h+='<div class="row"><button class="g" onclick="csvSum()">⬇ सारांश CSV</button><button class="g" onclick="csvInfo()">⬇ शाळा माहिती CSV</button><button class="g" onclick="window.print()">🖨 प्रिंट</button></div><div class="card"><h2>शाळानिहाय स्थिती</h2><div class="w"><table><tr><th>शाळा</th>'+(kp?'':'<th>केंद्र</th>')+'<th>माहिती</th><th>वि.</th><th>गणवेश</th><th>पुस्तके</th><th>बूट-मोजे</th><th>दप्तर</th><th>PM शेवटची नोंद</th></tr>'+R.map(function(r){return '<tr><td><a href="#" onclick="view(\''+r.u+'\');return false">'+esc(r.nm||r.u)+'</a><br><small>'+r.u+'</small></td>'+(kp?'':'<td>'+esc(CEN[r.c]||'')+'</td>')+'<td>'+(r.fs?'<span class="ok">✔ सादर</span>':r.fn?'<span class="no">अपूर्ण ('+r.fn+')</span>':'<span class="no">नाही</span>')+'</td><td>'+r.n+'</td><td>'+dl(r.uni,r.n)+'</td><td>'+dl(r.book,r.n)+'</td><td>'+dl(r.shoe,r.n)+'</td><td>'+dl(r.bag,r.n)+'</td><td>'+pmD(r.pm)+'</td></tr>'}).join('')+'</table></div></div><div id="v"></div>';
 X.innerHTML=h}
function sch(){return SF?Promise.resolve(SF):fetch('data/schoolform.json').then(function(r){return r.json()}).then(function(a){SF=a;return a})}
function rowsOf(o,fs){var L=[];fs.forEach(function(f){if(f.t==='photo'||f.t==='file')return;var nm=f.c.indexOf('{n}')>=0;if(nm){for(var i=1;i<=10;i++){var k=f.k+'#'+i;if(o[k]!=null)L.push([f.c.replace('{n}',i)+' – '+f.h,Array.isArray(o[k])?o[k].join(', '):o[k]])}}else if(o[f.k]!=null)L.push([f.c+' – '+f.h,Array.isArray(o[f.k])?o[f.k].join(', '):o[f.k]])});return L}
function view(u){var v=document.getElementById('v');v.innerHTML='<p class="m">…</p>';Promise.all([sch(),api('/api/o/form',{udise:u})]).then(function(a){var r=a[1].rows&&a[1].rows[0],s=DATA.filter(function(x){return x.u===u})[0];if(!r){v.innerHTML='<div class="card"><b>'+esc(s&&s.nm||u)+'</b><p class="m">या शाळेने अजून माहिती भरलेली नाही.</p></div>';v.scrollIntoView();return}var o={};try{o=JSON.parse(r.data)}catch(e){}v.innerHTML='<div class="card"><h2>'+esc(r.sc||u)+' ('+u+')</h2><p class="m">जतन: '+esc(r.upd)+' · भरणारे: '+esc(r.by)+' · '+(r.submitted?'सादर '+esc(r.submitted):'अपूर्ण')+'</p><div class="w"><table><tr><th>माहिती</th><th>उत्तर</th></tr>'+rowsOf(o,a[0]).map(function(x){return '<tr><td>'+esc(x[0])+'</td><td>'+esc(x[1])+'</td></tr>'}).join('')+'</table></div></div>';v.scrollIntoView()})}
function save(name,rows){var q=function(s){s=String(s==null?'':s);return '"'+s.replace(/"/g,'""')+'"'};var bl=new Blob(['﻿'+rows.map(function(r){return r.map(q).join(',')}).join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=name;document.body.appendChild(a);a.click();a.remove()}
function cur(){return DATA.filter(function(r){return !FL||r.c===FL})}
function csvSum(){var R=cur();save('shala_sthiti.csv',[['UDISE','शाळा','केंद्र','माहिती स्थिती','माहिती उत्तरे','सादर दिनांक','विद्यार्थी','गणवेश मिळाले','पुस्तके मिळाली','बूट-मोजे मिळाले','दप्तर मिळाले','PM शेवटची नोंद']].concat(R.map(function(r){return [r.u,r.nm,CEN[r.c]||'',r.fs?'सादर':r.fn?'अपूर्ण':'नाही',r.fn,r.fs,r.n,r.uni,r.book,r.shoe,r.bag,r.pm]})))}
function csvInfo(){var R=cur().filter(function(r){return r.fn}),us=R.map(function(r){return r.u});if(!us.length){alert('कोणत्याही शाळेने माहिती भरलेली नाही.');return}var all=[],i=0;sch().then(function(fs){(function nx(){if(i>=us.length){fin(fs,all);return}api('/api/o/form',{udise:us.slice(i,i+40)}).then(function(j){all=all.concat(j.rows||[]);i+=40;nx()})})()})}
function fin(fs,all){var seen={},items=all.map(function(r){var o={};try{o=JSON.parse(r.data)}catch(e){}return{r:r,L:rowsOf(o,fs)}}),nm=[];items.forEach(function(it){it.L.forEach(function(x){seen[x[0]]=1})});fs.forEach(function(f){if(f.t==='photo'||f.t==='file')return;if(f.c.indexOf('{n}')>=0){for(var n=1;n<=10;n++)nm.push(f.c.replace('{n}',n)+' – '+f.h)}else nm.push(f.c+' – '+f.h)});var cols=nm.filter(function(c){return seen[c]}),rows=[['UDISE','शाळा','स्थिती','जतन दिनांक','भरणारे'].concat(cols)];items.forEach(function(it){var m={};it.L.forEach(function(x){m[x[0]]=x[1]});rows.push([it.r.udise,it.r.sc||'',it.r.submitted?'सादर':'अपूर्ण',it.r.upd,it.r.by||''].concat(cols.map(function(c){return m[c]})))});save('shala_mahiti.csv',rows)}
T=sg('o_t');U=sg('o_u');LB=sg('o_l');ROLE=sg('o_r');if(T&&U)load();else loginUi();
</script></body></html>
