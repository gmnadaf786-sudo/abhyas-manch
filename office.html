function bankCard(u,nm){var x=SNA[u];return '<div class="card"><h2>🏦 '+esc(nm||u)+' — बँक व MHSN</h2>'+(x?'<div class="w"><table><tr><td>MHSN</td><td><b>'+esc(x.mhsn||'—')+'</b></td></tr><tr><td>बँक / शाखा</td><td>'+esc(x.bank)+' · '+esc(x.branch)+'</td></tr><tr><td>खाते क्रमांक (SNA Sparsh)</td><td><b>'+esc(x.acct)+'</b></td></tr><tr><td>IFSC</td><td>'+esc(x.ifsc)+'</td></tr></table></div>':'<p class="m">या शाळेची बँक / MHSN माहिती अजून भरलेली नाही.</p>')+'</div>'}
function view(u){var v=document.getElementById('v');v.innerHTML='<p class="m">…</p>';Promise.all([sch(),api('/api/o/form',{udise:u})]).then(function(a){var r=a[1].rows&&a[1].rows[0],s=DATA.filter(function(x){return x.u===u})[0];if(!r){v.innerHTML=bankCard(u,s&&s.nm)+'<div class="card"><b>'+esc(s&&s.nm||u)+'</b><p class="m">या शाळेने अजून माहिती भरलेली नाही.</p></div>';v.scrollIntoView();return}var o={};try{o=JSON.parse(r.data)}catch(e){}v.innerHTML=bankCard(u,r.sc)+'<div class="card"><h2>'+esc(r.sc||u)+' ('+u+')</h2><p class="m">जतन: '+esc(r.upd)+' · भरणारे: '+esc(r.by)+' · '+(r.submitted?'सादर '+esc(r.submitted):'अपूर्ण')+'</p><div class="w"><table><tr><th>माहिती</th><th>उत्तर</th></tr>'+rowsOf(o,a[0]).map(function(x){return '<tr><td>'+esc(x[0])+'</td><td>'+esc(x[1])+'</td></tr>'}).join('')+'</table></div></div>';v.scrollIntoView()})}
function save(name,rows){var q=function(s){s=String(s==null?'':s);return '"'+s.replace(/"/g,'""')+'"'};var bl=new Blob(['﻿'+rows.map(function(r){return r.map(q).join(',')}).join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=name;document.body.appendChild(a);a.click();a.remove()}
function cur(){return DATA.filter(function(r){return !FL||r.c===FL})}
function csvSum(){var R=cur();save('shala_sthiti.csv',[['UDISE','शाळा','केंद्र','MHSN','बँक','खाते क्रमांक','IFSC','शाखा','माहिती स्थिती','माहिती उत्तरे','सादर दिनांक','विद्यार्थी','PM शेवटची नोंद','PM नोंद दिवस']].concat(R.map(function(r){var q=SNA[r.u]||{};return [r.u,r.nm,CEN[r.c]||'',q.mhsn||'',q.bank||'',q.acct||'',q.ifsc||'',q.branch||'',r.fs?'सादर':r.fn?'अपूर्ण':'नाही',r.fn,r.fs,r.n,r.pm,r.pmc]})))}
function csvInfo(){var R=cur().filter(function(r){return r.fn}),us=R.map(function(r){return r.u});if(!us.length){alert('कोणत्याही शाळेने माहिती भरलेली नाही.');return}var all=[],i=0;sch().then(function(fs){(function nx(){if(i>=us.length){fin(fs,all);return}api('/api/o/form',{udise:us.slice(i,i+40)}).then(function(j){all=all.concat(j.rows||[]);i+=40;nx()})})()})}
function fin(fs,all){var seen={},items=all.map(function(r){var o={};try{o=JSON.parse(r.data)}catch(e){}return{r:r,L:rowsOf(o,fs)}}),nm=[];items.forEach(function(it){it.L.forEach(function(x){seen[x[0]]=1})});fs.forEach(function(f){if(f.t==='photo'||f.t==='file')return;if(f.c.indexOf('{n}')>=0){for(var n=1;n<=10;n++)nm.push(f.c.replace('{n}',n)+' – '+f.h)}else nm.push(f.c+' – '+f.h)});var cols=nm.filter(function(c){return seen[c]}),rows=[['UDISE','शाळा','स्थिती','जतन दिनांक','भरणारे'].concat(cols)];items.forEach(function(it){var m={};it.L.forEach(function(x){m[x[0]]=x[1]});rows.push([it.r.udise,it.r.sc||'',it.r.submitted?'सादर':'अपूर्ण',it.r.upd,it.r.by||''].concat(cols.map(function(c){return m[c]})))});save('shala_mahiti.csv',rows)}
T=sg('o_t');U=sg('o_u');LB=sg('o_l');ROLE=sg('o_r');if(T&&U)load();else loginUi();
