<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ರೇಖಾಗಣಿತ – ಅರ್ಥಮಾಡಿಕೊಳ್ಳೋಣ</title>
<style>
:root{--b:#1d4ed8;--g:#15803d;--o:#ea580c;--p:#7c3aed;--r:#dc2626;--bg:#f1f5f9;--ink:#0f172a;--mut:#64748b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Kannada","Tunga","Nirmala UI","Noto Sans Devanagari","Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.55}
header{background:linear-gradient(135deg,#1d4ed8,#7c3aed);color:#fff;padding:12px 14px;position:sticky;top:0;z-index:9}
header h1{margin:0;font-size:19px}header small{opacity:.9}
.wrap{max-width:820px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 6px #0001}
h2{margin:0 0 6px;font-size:20px;color:var(--b)}h3{margin:10px 0 4px;font-size:17px;color:#0f766e}
.btn{display:inline-block;border:0;border-radius:12px;padding:9px 14px;font:inherit;font-weight:700;background:var(--b);color:#fff;cursor:pointer;margin:3px 3px 3px 0}
.btn.gr{background:var(--g)}.btn.or{background:var(--o)}.btn.pu{background:var(--p)}.btn.ln{background:#e2e8f0;color:#1e293b}.btn.on{outline:3px solid #facc15}
.back{background:#fff;color:var(--b);border:2px solid var(--b)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:#fff;border-radius:14px;padding:12px;border:2px solid #cbd5e1;cursor:pointer;text-align:left}
.tile .ic{font-size:30px}.tile .tt{font-weight:800;font-size:16px;line-height:1.3}.tile .nn{font-size:12px;color:var(--mut);font-weight:700}
.tile.soon{opacity:.5;cursor:default}
.gh{font-weight:800;color:#fff;border-radius:10px;padding:5px 12px;margin:14px 0 8px;display:inline-block}
svg.fig{width:100%;height:auto;background:#f8fafc;border:2px solid #e2e8f0;border-radius:14px;touch-action:pan-y;display:block;user-select:none}
.key{background:#fef9c3;border-left:5px solid #eab308;padding:8px 10px;border-radius:8px;margin:8px 0}
.know{background:#ecfeff;border:2px dashed #06b6d4;padding:8px 12px;border-radius:12px;margin:10px 0}
.msg{margin-top:6px;padding:8px 10px;border-radius:10px;font-weight:700}
.msg.ok{background:#dcfce7;color:#166534}.msg.no{background:#fee2e2;color:#991b1b}.msg.in{background:#e0f2fe;color:#075985}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
input[type=range]{width:100%;accent-color:var(--b)}
.chip{padding:8px 13px;border-radius:999px;background:#e2e8f0;font-weight:700;border:2px solid transparent;cursor:pointer;user-select:none}
.chip.ok{background:#dcfce7;border-color:#16a34a}.chip.no{background:#fee2e2;border-color:#dc2626}
table.t{border-collapse:collapse;width:100%;font-size:15px}table.t td,table.t th{border:1px solid #cbd5e1;padding:6px;text-align:center}table.t th{background:#e0e7ff}
.big{font-size:26px;font-weight:800}
.foot{text-align:center;color:var(--mut);font-size:13px;margin:16px 0}
input.num{width:80px;font:inherit;padding:6px;border:2px solid #94a3b8;border-radius:8px}
.an{stroke-dasharray:1;stroke-dashoffset:0;animation:dr .9s ease-out}.fi{animation:fi .3s .8s both}@keyframes fi{from{opacity:0}to{opacity:1}}@keyframes dr{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}</style>
</head>
<body>
<header><h1 id="hd">📐 ರೇಖಾಗಣಿತ – ಅರ್ಥಮಾಡಿಕೊಳ್ಳೋಣ</h1><small id="sub">ಬಿಂದುವಿನಿಂದ ರಚನೆಯವರೆಗೆ – ಅಲ್ಲಾಡಿಸಿ, ಅಳೆಯಿರಿ, ಕಲಿಯಿರಿ</small></header>
