<!DOCTYPE html>
<html lang="kn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ತರಗತಿ ೮ ವಿಜ್ಞಾನ - ಪಾಠ 16 ಬೆಳಕಿನ ಪ್ರತಿಫಲನ</title>
<style>
:root{--b:#0d9488;--g:#16a34a;--o:#ea580c;--p:#7c3aed;--bg:#ecfeff;--ink:#0f172a;--mut:#64748b;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Noto Sans Kannada","Mukta","Segoe UI",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#0f766e,#0369a1);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:8px}
header h1{font-size:16.5px;margin:0;flex:1;line-height:1.3}
.pill{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:99px;padding:6px 12px;font-size:14px;font-weight:700}
main{max-width:720px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{border:0;border-radius:20px;color:#fff;padding:18px 8px;text-align:center;font-weight:800;font-size:18px;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.tile small{display:block;font-weight:500;font-size:12.5px;opacity:.92;margin-top:2px}
.tile .em{font-size:40px;display:block}
.btn{border:0;background:var(--b);color:#fff;border-radius:12px;padding:10px 16px;font-size:16px;font-weight:700}
.btn.g{background:var(--g)}.btn.l{background:#e2e8f0;color:var(--ink)}.btn.o{background:var(--o)}.btn:disabled{opacity:.4}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border-radius:12px;border:2px solid #cbd5e1;background:#fff;font-size:16.5px}
.opt.ok{border-color:var(--g);background:#dcfce7}.opt.bad{border-color:#dc2626;background:#fee2e2}
.hint{background:#fef9c3;border-left:4px solid #eab308;padding:8px 10px;border-radius:8px;margin:8px 0;font-size:15px}
.good{background:#dcfce7;border-left:4px solid var(--g);padding:8px 10px;border-radius:8px;margin:8px 0;font-size:15px}
.note{background:#e0f2fe;border-left:4px solid #0284c7;padding:8px 10px;border-radius:8px;margin:8px 0;font-size:15px}
.dots{display:flex;gap:4px;margin:4px 0 10px}.dots i{flex:1;height:7px;border-radius:9px;background:#cbd5e1}.dots i.d{background:var(--g)}.dots i.c{background:var(--b)}
.read{font-size:17.5px;line-height:1.75}
.read b{color:#0f766e}
.star{background:#fef3c7;border-radius:99px;padding:4px 12px;font-weight:800;color:#b45309;font-size:15px}
.q{font-weight:700}
.sq{border:1px solid #e2e8f0;border-radius:12px;padding:10px;margin:8px 0}.sq .ans{display:none;margin-top:8px;padding:8px;background:#f0fdf4;border-left:4px solid var(--g);border-radius:8px}.sq.op .ans{display:block}
.sq button{font-size:20px;padding:0 10px;border:0;background:#e2e8f0;border-radius:8px;margin-left:6px}
h2{font-size:19px;margin:6px 0}h3{font-size:16px;margin:12px 0 4px;color:#0f766e}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mt button{padding:10px 6px;border-radius:10px;border:2px solid #cbd5e1;background:#fff;font-size:15px;min-height:48px}
.mt button.sel{border-color:var(--b);background:#ccfbf1}.mt button.done{border-color:var(--g);background:#dcfce7;opacity:.7}
.chip{display:inline-block;margin:4px;padding:8px 12px;border-radius:99px;border:2px solid #94a3b8;background:#fff;font-size:16px;font-weight:600}
.chip.used{opacity:.3}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--b);text-align:center;font-weight:800;color:#0f766e;margin:0 2px}
.blank.ok{color:#16a34a;border-color:#16a34a}.blank.no{color:#dc2626;border-color:#dc2626}
.flip{display:block;width:100%;margin:8px 0;padding:14px;border-radius:14px;border:2px solid #5eead4;background:#f0fdfa;font-size:16.5px;text-align:left}
.flip.on{background:#fef3c7;border-color:#f59e0b}
.fig{display:inline-block;text-align:center;margin:6px;font-size:13px;color:#475569;vertical-align:top}
.figs{text-align:center}
svg text{font-family:"Noto Sans Kannada",sans-serif}
.lab{border:2px solid #14b8a6;border-radius:16px;padding:10px;background:#f0fdfa}
.step{background:#fff;border-radius:12px;padding:10px;margin:8px 0;border:1px solid #99f6e4}
.bar{height:22px;border-radius:6px;background:linear-gradient(90deg,#14b8a6,#0369a1);color:#fff;font-size:12px;padding:0 6px;margin:3px 0;line-height:22px}
.tr{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.tr .bx{background:#ccfbf1;border:2px solid #14b8a6;border-radius:10px;padding:6px 10px;font-weight:700;font-size:14px;text-align:center}
.tr .ar{font-size:20px;color:#0f766e}
#print{display:none}
.pvc,#print{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='430' height='190'><text x='215' y='105' text-anchor='middle' transform='rotate(-22 215 95)' font-size='15' font-weight='bold' fill='rgba(15,23,42,0.13)' font-family='Noto Sans Kannada,sans-serif'>ಜಿ.ಎಂ.ನದಾಫ್ ಕೇಂದ್ರ ಪ್ರಮುಖ ಗಿರಗಾಂವ ತಾ.ಜತ್ 7972568986</text></svg>");background-repeat:repeat;-webkit-print-color-adjust:exact;print-color-adjust:exact}
@media print{body>*:not(#print){display:none!important}#print{display:block}#print .sq .ans{display:block!important}#print{font-size:14px}.pf{position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:11px;border-top:1px solid #999;padding-top:3px}.ph{border-bottom:2px solid #000;margin-bottom:8px;padding-bottom:4px}}
.foot{text-align:center;color:var(--mut);font-size:12.5px;margin:16px 0}
</style></head><body>
