<!DOCTYPE html>
<html lang="kn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>8ನೇ ತರಗತಿ ಗಣಿತ - ಪಾಠ 15 ವಿಸ್ತೀರ್ಣ</title>
<style>
:root{--b:#2563eb;--g:#16a34a;--o:#ea580c;--p:#7c3aed;--bg:#eff6ff;--ink:#0f172a;--mut:#64748b;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 "Noto Sans Kannada","Noto Sans Devanagari","Mukta","Segoe UI",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#1d4ed8,#7c3aed);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:8px}
header h1{font-size:16.5px;margin:0;flex:1;line-height:1.3}
.pill{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:99px;padding:6px 12px;font-size:14px;font-weight:700}
main{max-width:720px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{border:0;border-radius:20px;color:#fff;padding:18px 8px;text-align:center;font-weight:800;font-size:18px;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.tile small{display:block;font-weight:500;font-size:12.5px;opacity:.92;margin-top:2px}
.tile .em{font-size:40px;display:block}
.star{background:#fef3c7;border-radius:99px;padding:4px 12px;font-weight:800;color:#b45309;font-size:15px}
.foot{text-align:center;color:var(--mut);font-size:12.5px;margin:16px 0}
#print{display:none}
.pvc,#print{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='430' height='190'><text x='215' y='105' text-anchor='middle' transform='rotate(-22 215 95)' font-size='15' font-weight='bold' fill='rgba(15,23,42,0.13)' font-family='Noto Sans Kannada,sans-serif'>ಜಿ.ಎಂ.ನದಾಫ್ ಕೇಂದ್ರ ಪ್ರಮುಖ ಗಿರಗಾಂವ್ ತಾ.ಜತ್ 7972568986</text></svg>");background-repeat:repeat;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pvq{break-inside:avoid;margin:8px 0}.pvo{display:flex;flex-wrap:wrap;gap:2px 20px;margin-left:20px}.pvb{border:1.5px dashed #999;border-radius:8px;height:60px;margin:4px 0 0 20px}.pvs{background:#eef2ff;padding:3px 10px;border-radius:6px;font-weight:700;margin:12px 0 6px}.cell{display:inline-block;border:1.5px solid #333;border-radius:8px;padding:5px 10px;margin:3px;text-align:center}
@media print{body>*:not(#print){display:none!important}#print{display:block}#print{font-size:14px}.pf{position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:11px;border-top:1px solid #999;padding-top:3px}.ph{border-bottom:2px solid #000;margin-bottom:8px;padding-bottom:4px}.pva{break-before:page}}
.btn{border:0;background:var(--b);color:#fff;border-radius:12px;padding:10px 16px;font-size:16px;font-weight:700}
.btn.g{background:var(--g)}.btn.l{background:#e2e8f0;color:var(--ink)}.btn.o{background:var(--o)}.btn:disabled{opacity:.4}
.opt{display:inline-block;margin:5px 6px 5px 0;padding:10px 16px;border-radius:12px;border:2px solid #cbd5e1;background:#fff;font-size:17px;min-width:56px;text-align:center}
.opt.ok{border-color:var(--g);background:#dcfce7}.opt.bad{border-color:#dc2626;background:#fee2e2}.opt.sel{border-color:var(--b);background:#dbeafe}
.hint{background:#fef9c3;border-left:4px solid #eab308;padding:8px 10px;border-radius:8px;margin:8px 0;font-size:15px}
.good{background:#dcfce7;border-left:4px solid var(--g);padding:8px 10px;border-radius:8px;margin:8px 0;font-size:15px}
.note{background:#e0e7ff;border-left:4px solid #4f46e5;padding:8px 10px;border-radius:8px;margin:8px 0;font-size:15px}
.dots{display:flex;gap:4px;margin:4px 0 10px}.dots i{flex:1;height:7px;border-radius:9px;background:#cbd5e1}.dots i.d{background:var(--g)}.dots i.c{background:var(--b)}
.ex{border:2px dashed #93c5fd;border-radius:14px;padding:10px;background:#f8fafc}
.ex h3{margin:0 0 6px;font-size:17px;color:#1d4ed8}
.st{border-top:1px solid #e2e8f0;padding:8px 0;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sn{display:inline-block;background:var(--b);color:#fff;border-radius:99px;width:24px;height:24px;line-height:24px;text-align:center;font-size:13px;font-weight:800;margin-right:6px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;font-size:.92em;line-height:1.15}
.fr i{font-style:normal;padding:0 3px}.fr i:first-child{border-bottom:1.6px solid currentColor}
.rp{border-top:2px solid currentColor;padding-top:0}
input.in{width:110px;font-size:18px;padding:8px 10px;border:2px solid #94a3b8;border-radius:10px;text-align:center}
input.in.ok{border-color:var(--g);background:#dcfce7}input.in.bad{border-color:#dc2626;background:#fee2e2}
svg{max-width:100%;height:auto}
.tick{cursor:pointer}
.bucket{display:inline-block;margin:6px 6px 0 0;padding:12px 14px;border-radius:12px;border:2px solid var(--b);font-weight:700;background:#eff6ff;min-width:44%}
.chip{display:inline-block;margin:4px;padding:8px 14px;border-radius:99px;background:#fff;border:2px solid #cbd5e1;font-size:18px}
.chip.sel{border-color:var(--b);background:#dbeafe}.chip.done{opacity:.35}
.big{font-size:20px}
svg text{font-family:"Noto Sans Kannada",sans-serif}</style></head><body>
