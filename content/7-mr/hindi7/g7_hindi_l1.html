<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>7 वी हिंदी – पाठ 1 वाचन मेला</title>
<style>
:root{--b:#1d4ed8;--g:#15803d;--o:#ea580c;--p:#7c3aed;--bg:#f1f5f9;--ink:#0f172a;--mut:#64748b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Devanagari","Mukta","Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.55}
header{background:linear-gradient(135deg,#0f766e,#1d4ed8);color:#fff;padding:12px 14px}
header h1{margin:0;font-size:19px}header small{opacity:.9}
.tabs{display:flex;gap:6px;padding:8px 10px;background:#fff;position:sticky;top:0;z-index:5;box-shadow:0 1px 4px #0002;overflow-x:auto}
.tabs button{flex:1;min-width:80px;padding:10px 6px;border:0;border-radius:10px;font:inherit;font-weight:700;background:#e2e8f0;color:#334155;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--b);color:#fff}
.tabs button.t2.on{background:var(--g)}.tabs button.t3.on{background:var(--o)}.tabs button.t4.on{background:var(--p)}
.wrap{max-width:780px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 6px #0001}
h2{margin:0 0 6px;font-size:20px;color:var(--b)}
h3{margin:10px 0 4px;font-size:17px;color:#0f766e}
.step{font-size:13px;color:var(--mut);font-weight:700}
.btn{display:inline-block;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;background:var(--b);color:#fff;cursor:pointer;margin:4px 4px 4px 0}
.btn.gr{background:var(--g)}.btn.or{background:var(--o)}.btn.pu{background:var(--p)}.btn.ln{background:#e2e8f0;color:#1e293b}.btn:disabled{opacity:.4}
.btn.sm{padding:6px 12px;font-size:15px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{padding:8px 13px;border-radius:999px;background:#e2e8f0;font-weight:700;border:2px solid transparent;cursor:pointer;user-select:none}
.chip.on{background:#dbeafe;border-color:var(--b);color:var(--b)}
.msg{margin-top:6px;padding:8px 10px;border-radius:10px;font-weight:600}
.msg.ok{background:#dcfce7;color:#166534}.msg.no{background:#fee2e2;color:#991b1b}.msg.in{background:#fef9c3;color:#713f12}
.say{float:right;border:0;background:#eff6ff;border-radius:999px;padding:6px 12px;font:inherit;font-weight:700;color:var(--b);cursor:pointer}
.key{background:#fef9c3;border-left:5px solid #eab308;padding:8px 10px;border-radius:8px;margin:8px 0}
.know{background:#ecfeff;border:2px dashed #06b6d4;padding:8px 12px;border-radius:12px;margin:10px 0}
.know b.h{color:#0e7490}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:8px 0}
.tile{border:2px solid #cbd5e1;border-radius:14px;padding:10px;cursor:pointer;background:#f8fafc;transition:.2s}
.tile:hover{border-color:var(--b)}
.tile .ic{font-size:34px;line-height:1}
.tile .tt{font-weight:800;font-size:17px;margin-top:2px}
.tile .dd{display:none;font-size:15px;margin-top:6px;color:#334155}
.tile.op{background:#eff6ff;border-color:var(--b)}.tile.op .dd{display:block}
.tap{font-size:12px;color:var(--mut)}
svg{max-width:100%;height:auto}
.sort{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 8px;border:1.5px solid #e2e8f0;border-radius:12px;padding:8px 10px;margin:6px 0;background:#fff}
.sort.ok{background:#dcfce7;border-color:#86efac}.sort.no{background:#fee2e2;border-color:#fca5a5}
.sort>span:first-child{flex:1 1 150px;min-width:0}.sort .bb{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 auto;justify-content:flex-end;max-width:100%}.sort .bb .btn{margin:0}
html,body{overflow-x:hidden}.btn,.chip{max-width:100%}
.qbox{font-size:18px;font-weight:700;margin:6px 0 8px}
.opt{display:block;width:100%;text-align:left;padding:10px 12px;margin:6px 0;border:2px solid #cbd5e1;border-radius:12px;background:#fff;font:inherit;cursor:pointer}
.opt.ok{background:#dcfce7;border-color:#22c55e}.opt.no{background:#fee2e2;border-color:#ef4444}
.bar{height:10px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--g)}
.sq{border:1.5px solid #e2e8f0;border-radius:12px;padding:10px;margin:8px 0}
.sq .ans{display:none;margin-top:6px;background:#f0fdf4;border-left:4px solid #22c55e;padding:6px 10px;border-radius:8px}
.sq.op .ans{display:block}
.sq textarea{width:100%;min-height:54px;font:inherit;padding:6px;border-radius:8px;border:1.5px solid #94a3b8;margin-top:4px}
.hint{display:none;font-size:15px;color:#7c2d12;background:#fff7ed;padding:4px 8px;border-radius:8px;margin-top:4px}.sq.hi .hint{display:block}
table.t{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0}
table.t th,table.t td{border:1.5px solid #94a3b8;padding:6px;text-align:center}
table.t th{background:#dbeafe}table.t td.l{text-align:left}
table.t input{width:64px;font:inherit;padding:4px;border:1.5px solid #94a3b8;border-radius:6px;text-align:center}
.ws{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:420px;margin:8px auto}
.ws div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:2px solid #cbd5e1;border-radius:8px;font-weight:800;font-size:20px;cursor:pointer;background:#fff;user-select:none}
.ws div.sel{background:#fef08a;border-color:#ca8a04}.ws div.fd{background:#bbf7d0;border-color:#16a34a}
.tool{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#f8fafc;border:1.5px dashed #94a3b8;border-radius:12px;padding:8px 10px;margin-top:10px}
.tool input[type=text]{font:inherit;padding:6px;border-radius:8px;border:2px solid #94a3b8;width:200px}
.pledge{background:linear-gradient(135deg,#ecfeff,#f0fdf4);border:2px solid #14b8a6;border-radius:14px;padding:12px;font-weight:600}
footer.site{text-align:center;font-size:13px;color:var(--mut);padding:10px 0 20px}
.topbar{display:flex;align-items:center;gap:10px;padding:6px 10px;background:#fff;position:sticky;top:0;z-index:5;box-shadow:0 1px 4px #0002}
.topbar b{font-size:18px}
.hintro{background:#fff;border-radius:14px;padding:10px 14px;margin:4px 0 12px;font-weight:600;box-shadow:0 1px 6px #0001}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hc{border-radius:20px;padding:22px 12px;min-height:170px;color:#fff;cursor:pointer;text-align:center;display:flex;flex-direction:column;justify-content:center;box-shadow:0 4px 14px #0003;transition:transform .15s}
.hc:active,.hc:hover{transform:scale(1.03)}
.hc .hi{font-size:54px;line-height:1.1}.hc .ht{font-size:26px;font-weight:800;margin-top:6px}.hc .hs{font-size:14px;opacity:.95;margin-top:2px}
.hc.c1{background:linear-gradient(135deg,#2563eb,#1e40af)}.hc.c2{background:linear-gradient(135deg,#16a34a,#166534)}
.hc.c3{background:linear-gradient(135deg,#f97316,#c2410c)}.hc.c4{background:linear-gradient(135deg,#8b5cf6,#6d28d9)}
@media(max-width:380px){.hc{min-height:140px}.hc .hi{font-size:42px}.hc .ht{font-size:21px}}
#vP .ptool{background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:10px;box-shadow:0 1px 6px #0001}
#shw{background:#cbd5e1;border-radius:10px;padding:8px;overflow:auto}
.sheet{background:#fff;color:#000;width:210mm;min-height:297mm;padding:12mm;margin:0 auto 10px;box-shadow:0 2px 10px #0004;font-size:11pt;line-height:1.45;position:relative;font-family:"Noto Sans Devanagari","Mukta","Nirmala UI","Mangal",sans-serif;

.sheet h3{margin:4px 0;font-size:14pt;text-align:center;color:#000}
.sh-head{border:1.5px solid #000;padding:4px 8px;margin-bottom:6px}
.sh-head .r{display:flex;justify-content:space-between;gap:10px;margin:2px 0}
.ln2{display:inline-block;border-bottom:1px solid #000;min-width:40mm}
.pq{margin:6px 0 2px;font-weight:700}.pq small{font-weight:400}
.pl{border-bottom:1px dotted #555;height:7mm}
.po{display:grid;grid-template-columns:1fr 1fr;gap:0 10mm;margin:0 0 4px 6mm}
.pk{border-top:2px dashed #000;margin-top:8mm;padding-top:3mm;page-break-before:always;break-before:page}
.fp{font-size:8.5pt;color:#222;display:flex;justify-content:space-between;gap:8px;border-top:1px solid #777;padding-top:2px;margin-top:8mm}
.wmp{display:none}
.tw{animation:tw 1.4s ease-in-out infinite alternate}@keyframes tw{from{opacity:1}to{opacity:.15}}
table.w{border-collapse:collapse;width:100%}table.w th,table.w td{border:1.2px solid #000;padding:3px 5px;text-align:center}table.w th{background:#eee}
table.pt{width:100%;border-collapse:collapse}table.pt>thead td,table.pt>tfoot td,table.pt>tbody>tr>td{padding:0;border:0}
@page{size:A4;margin:10mm 12mm 8mm}
@media print{
 html,body{background:#fff!important}
 .cf,header,.topbar,#home,#vA,#vB,#vC,#vD,footer.site,.ptool{display:none!important}
 .wrap{padding:0;max-width:none}#vP{display:block!important}
 #shw{background:none;padding:0;overflow:visible}

 .wmp{display:block;position:fixed;top:40%;left:0;right:0;text-align:center;transform:rotate(-30deg);color:rgba(29,78,216,.10);font-size:56pt;font-weight:800;line-height:1.25;z-index:0;pointer-events:none}
 .fp{position:fixed;bottom:0;left:0;right:0;margin:0;background:#fff}
 .sp{height:9mm}
 .avoid{page-break-inside:avoid;break-inside:avoid}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
