<meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>इयत्ता १ ली मराठी – मुळाक्षर सराव</title><style>body{margin:0}</style></head><body><!-- ===== इयत्ता १ ली मराठी: मुळाक्षर वाचन-लेखन सराव (स्वतंत्र मॉड्यूल). openMulakshar_() बोलवा ===== -->
<style>
#mkModal{display:none;position:fixed;inset:0;z-index:100300;background:#fffaf0;flex-direction:column;color:#1f2937;font-family:inherit}
#mkModal.open{display:flex}
#mkApp{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px}
#mkApp *{box-sizing:border-box}
.mk-h{background:#ef6c00;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
.mk-h h2{margin:0;flex:1;font-size:20px;font-weight:900;line-height:1.25}
.mk-h button{border:0;background:rgba(255,255,255,.25);color:#fff;width:40px;height:40px;border-radius:50%;font-size:20px;font-weight:900}
.mk-sub{margin:12px 16px 4px;font-size:13px;font-weight:900;color:#92400e}
.mk-li{display:flex;align-items:center;gap:12px;width:calc(100% - 32px);margin:10px 16px;padding:14px;border:0;border-radius:20px;background:#fff;box-shadow:0 2px 8px rgba(120,53,15,.18);text-align:left;font-size:20px;font-weight:900;color:#1f2937}
.mk-no{flex:0 0 46px;height:46px;border-radius:50%;background:#e53935;color:#fff;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center}
.mk-li small{display:block;font-size:12px;color:#78716c;font-weight:700;margin-top:2px}
.mk-li .p{margin-left:auto;font-size:22px;color:#a8a29e}
.mk-tabs{display:flex;background:#fed7aa;gap:6px;padding:8px 10px}
.mk-tabs button{flex:1;padding:13px;border:3px solid transparent;border-radius:16px;color:#fff;font-weight:900;font-size:17px;opacity:.55}
.mk-tabs button.tr{background:#2563eb}.mk-tabs button.tw{background:#16a34a}
.mk-tabs button.on{opacity:1;border-color:#1f2937;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.mk-tabs button.tg{background:#9333ea}
.mk-pic{display:block;margin:0 auto 6px;max-width:210px;max-height:170px;border-radius:14px}
.mk-gc{display:flex;flex-direction:column;gap:10px;margin:10px 16px}
.mk-gc button{padding:16px;border-radius:18px;border:3px solid #fdba74;background:#fff;font-size:34px;font-weight:800;color:#1f2937}
.mk-gc button.ok{background:#dcfce7;border-color:#16a34a}.mk-gc button.no{background:#fee2e2;border-color:#dc2626}
.mk-cnt{text-align:center;margin:12px 0 4px;font-weight:900;color:#78716c}
.mk-card{margin:8px 16px;padding:18px 12px;background:#fff;border-radius:24px;box-shadow:0 3px 12px rgba(120,53,15,.2);text-align:center}
.mk-big{font-size:110px;line-height:1.25;font-weight:700;color:#1f2937;word-break:keep-all}
.mk-big.w{font-size:68px}.mk-big.s{font-size:30px;line-height:1.6;font-weight:800}
.mk-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 16px}
.mk-b{border:0;border-radius:18px;padding:14px 20px;font-size:18px;font-weight:900;color:#fff;background:#2563eb}
.mk-b.g{background:#16a34a}.mk-b.r{background:#dc2626}.mk-b.o{background:#ea580c}.mk-b.x{background:#e7e5e4;color:#44403c}
.mk-b.listen{background:#0ea5e9}.mk-b.mic{background:#e11d48}
.mk-b.rec{animation:mkp 1s infinite}
@keyframes mkp{50%{transform:scale(1.07);box-shadow:0 0 0 8px rgba(225,29,72,.25)}}
.mk-res{margin:8px 16px;padding:12px;border-radius:16px;text-align:center;font-size:18px;font-weight:900}
.mk-res.ok{background:#dcfce7;color:#166534}.mk-res.no{background:#fee2e2;color:#991b1b}.mk-res.info{background:#fef3c7;color:#92400e;font-size:14px;font-weight:700}
.mk-star{font-size:34px;letter-spacing:4px}
.mk-nav{display:flex;gap:12px;margin:14px 16px}
.mk-nav button{flex:1;padding:15px;border-radius:18px;border:2px solid #fdba74;background:#fff;font-size:18px;font-weight:900;color:#9a3412}
.mk-nav button.pri{background:#ef6c00;border-color:#ef6c00;color:#fff}
.mk-nav button:disabled{opacity:.4}
.mk-cv{position:relative;margin:8px 16px;background:#fff;border-radius:20px;box-shadow:0 3px 12px rgba(120,53,15,.2);overflow:hidden;touch-action:none}
.mk-cv canvas{display:block;width:100%;height:auto;touch-action:none}
.mk-cv .ink{position:absolute;left:0;top:0}
.mk-chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px}
.mk-chips button{min-width:40px;height:40px;border-radius:12px;border:1.5px solid #fdba74;background:#fff;font-weight:900;font-size:17px;color:#7c2d12}
.mk-chips button.on{background:#ef6c00;color:#fff;border-color:#ef6c00}
.mk-chips button.d{background:#dcfce7;border-color:#16a34a;color:#166534}
.mk-note{margin:12px 16px;padding:12px;background:#fff;border:1px solid #fed7aa;border-radius:14px;font-size:14px;line-height:1.5}
</style>
