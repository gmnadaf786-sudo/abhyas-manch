.swq-pdf{font-size:12px;color:#2563eb;font-weight:700;text-decoration:none}
.swq-q{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 10px #0001;font-size:18px;line-height:1.6;font-weight:600;color:#1e293b}
.swq-ans{display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap}.swq-ans input,.swq-pair input{font-size:20px;padding:9px 10px;border:2px solid #f9a8d4;border-radius:10px;width:130px;text-align:center}

.swq-b{border:0;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:700;color:#fff;background:#e91e63;cursor:pointer;margin:4px 4px 4px 0}.swq-b.green{background:#16a34a}.swq-b.blue{background:#2563eb}.swq-b.orange{background:#f59e0b}.swq-b.gray{background:#64748b}
.swq-opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #f9a8d4;border-radius:10px;padding:12px;margin:6px 0;font-size:16px;font-weight:600;cursor:pointer;color:#1e293b}.swq-opt.ok{background:#dcfce7;border-color:#16a34a}.swq-opt.no{background:#fee2e2;border-color:#dc2626}
.swq-fb{border-radius:10px;padding:9px 12px;margin:8px 0;font-weight:600}.swq-fb.ok{background:#dcfce7;color:#166534}.swq-fb.no{background:#fee2e2;color:#991b1b}.swq-fb.hint{background:#fef3c7;color:#92400e}

.swq-grid{margin:0 auto;border-collapse:separate;border-spacing:3px;--cw:46px}.swq-grid td{text-align:center;padding:0;height:var(--cw)}.swq-grid td.dg{min-width:var(--cw);font-size:calc(var(--cw)*.55);font-weight:800;color:#1e293b;background:#f1f5f9;border-radius:8px}.swq-grid td.dg.dim{color:#94a3b8}.swq-grid td.dg.br{background:#e0f2fe}.swq-grid td.sg{font-size:calc(var(--cw)*.5);font-weight:800;color:#e91e63;min-width:calc(var(--cw)*.6);white-space:nowrap}.swq-grid td.sg.dvs{color:#1d4ed8;border-right:3px solid #1e293b;padding-right:6px}.swq-grid td.dot{width:10px;font-size:calc(var(--cw)*.6);font-weight:800;color:#1e293b}.swq-grid td.tl{border-top:3px solid #1e293b}

.swq-gi.cur{border-color:#e91e63;background:#fff;box-shadow:0 0 0 3px #fbcfe8}.swq-gi.ok{border-color:#16a34a;background:#dcfce7;color:#166534}.swq-gi.bad{border-color:#dc2626;background:#fee2e2}.swq-gi.helped{border-color:#f59e0b;background:#fef3c7}
