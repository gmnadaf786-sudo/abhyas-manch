<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>वाचन सराव – पावसाची गंमत</title><style>
:root{--b:#1d4ed8;--g:#15803d;--r:#dc2626;--bg:#f1f5f9;--ink:#0f172a;--mut:#64748b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans Devanagari",sans-serif}
.hd{background:linear-gradient(135deg,#1d4ed8,#7c3aed);color:#fff;padding:14px 16px;font-weight:800;font-size:20px}
.hd small{display:block;font-weight:500;font-size:13px;opacity:.9;margin-top:2px}
main{max-width:680px;margin:0 auto;padding:12px}
.c{background:#fff;border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 2px 8px #0001}
.c h3{margin:0 0 8px;font-size:17px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-size:17px;font-weight:700;color:#fff;background:var(--b)}
.btn.s{background:var(--r)}.btn.g{background:var(--g)}
.bar label{font-size:14px;color:var(--mut)}
.txt{font-size:24px;line-height:1.85}
.sn{cursor:pointer;border-radius:6px;padding:1px 2px}.sn.on{background:#fde68a}
.w{display:flex;gap:8px;padding:8px 0;border-bottom:1px dashed #e2e8f0;font-size:17px}.w b{min-width:110px;color:var(--b)}
.q{margin-bottom:14px}.q p{font-size:18px;font-weight:700;margin:0 0 8px}
.o{display:block;width:100%;text-align:left;padding:12px;margin:6px 0;border:2px solid #e2e8f0;border-radius:12px;background:#fff;font-size:17px}
.o.ok{border-color:var(--g);background:#dcfce7}.o.no{border-color:var(--r);background:#fee2e2}
#sc{font-size:20px;font-weight:800;text-align:center;padding:10px;display:none}
