<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ಇತಿಹಾಸ</title>
<style>
:root{--b:#7c2d12;--b2:#c2410c;--g:#15803d;--bl:#1d4ed8;--bg:#fff7ed;--ink:#1c1917;--mut:#78716c;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Devanagari","Mukta","Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.55}
header{background:linear-gradient(135deg,#9a3412,#c2410c 55%,#b45309);color:#fff;padding:14px 14px 12px}
header h1{margin:0;font-size:20px;line-height:1.3}header small{opacity:.92}
.wrap{max-width:820px;margin:0 auto;padding:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.hc{padding:12px 10px}.hc .ic{font-size:28px}.hc h2{font-size:16px}.hc p{font-size:12.5px}}
.hc{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 2px 8px #0002;cursor:pointer;border:2px solid transparent;text-align:left;font:inherit;color:inherit}
.hc:active{transform:scale(.98)}.hc:hover{border-color:var(--b2)}
.hc .ic{font-size:34px}.hc h2{margin:4px 0 2px;font-size:20px;color:var(--b)}.hc p{margin:0;color:var(--mut);font-size:14.5px}
.card{background:var(--card);border-radius:16px;padding:14px;margin:0 0 12px;box-shadow:0 1px 6px #0001}
.card h2{margin:0 0 6px;font-size:20px;color:var(--b)}
.card h3{margin:10px 0 4px;font-size:17px;color:var(--b2)}
.back{border:0;background:#fed7aa;color:#7c2d12;border-radius:999px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer;margin:0 0 10px}
.btn{display:inline-block;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;background:var(--b2);color:#fff;cursor:pointer;margin:4px 4px 4px 0}
.btn.gr{background:var(--g)}.btn.bl{background:var(--bl)}.btn.ln{background:#e7e5e4;color:#292524}.btn:disabled{opacity:.4}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{padding:7px 13px;border-radius:999px;background:#ffedd5;font-weight:700;border:2px solid transparent;cursor:pointer;font:inherit;font-weight:700;color:#7c2d12}
.chip.on{background:#fff;border-color:var(--b2)}
.info{background:#fef3c7;border-left:5px solid #f59e0b;border-radius:8px;padding:8px 10px;margin:6px 0;min-height:44px}
.key{background:#ecfccb;border-left:5px solid #65a30d;border-radius:8px;padding:8px 10px;margin:8px 0}
.say{float:right;border:0;background:#ffedd5;border-radius:999px;padding:6px 12px;font:inherit;font-weight:700;color:var(--b);cursor:pointer}
.prog{height:8px;background:#fed7aa;border-radius:99px;overflow:hidden;margin:4px 0 10px}.prog i{display:block;height:100%;background:var(--g);transition:width .3s}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:10px;align-items:center}
.flip{background:#e0f2fe;border-radius:12px;padding:10px 12px;margin:6px 0;cursor:pointer;border:2px dashed #38bdf8}
.flip .fa{display:none;margin-top:6px;font-weight:700;color:#0c4a6e}.flip.on .fa{display:block}.flip .fq{font-weight:700}
.opt{display:block;width:100%;text-align:left;border:2px solid #d6d3d1;background:#fff;border-radius:12px;padding:9px 12px;margin:6px 0;font:inherit;cursor:pointer}
.opt.ok{background:#dcfce7;border-color:#16a34a}.opt.no{background:#fee2e2;border-color:#dc2626}
.msg{margin-top:6px;padding:8px 10px;border-radius:10px;font-weight:600}.msg.ok{background:#dcfce7;color:#166534}.msg.no{background:#fee2e2;color:#991b1b}.msg.in{background:#fef9c3;color:#713f12}
.mini{border:2px solid #fdba74;border-radius:14px;padding:10px;margin-top:12px;background:#fffbeb}
table.t{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0}table.t th,table.t td{border:1.5px solid #a8a29e;padding:6px;text-align:center}table.t th{background:#ffedd5}
select,input[type=text],input[type=number]{font:inherit;padding:6px;border-radius:8px;border:2px solid #a8a29e;max-width:100%}
.ord{display:flex;flex-direction:column;gap:6px;margin:6px 0}.ord button{text-align:left}
.tool{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}.tool label{font-weight:700}
.ans{background:#f0fdf4;border-left:5px solid #22c55e;border-radius:8px;padding:8px 10px;margin:6px 0;white-space:pre-line;display:none}
.ans.show{display:block}
.qcard{border:1.5px solid #e7e5e4;border-radius:12px;padding:10px;margin:8px 0}
.tag{display:inline-block;background:#fde68a;color:#78350f;border-radius:99px;padding:1px 10px;font-size:13px;font-weight:700;margin-right:6px}
.paper{background:#fff;border:1px solid #a8a29e;box-shadow:0 2px 10px #0003;margin:10px auto 0;padding:8px 10px;max-width:210mm;overflow:auto;font-size:14px;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='360' height='260'><text x='20' y='150' font-size='20' font-weight='700' fill='%23000' fill-opacity='0.055' transform='rotate(-28 180 130)' font-family='sans-serif'>ಜಿ.ಎಂ.ನದಾಫ್ ಕೇಂದ್ರ ಮುಖ್ಯಸ್ಥ ಗಿರಗಾಂವ್ ತಾ.ಜತ್ 7972568986</text></svg>")}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.sc{background:#fff;border:2px dashed #f59e0b;border-radius:14px;padding:8px;text-align:center;cursor:pointer;min-height:110px}.sc .sy{font-size:44px;line-height:1.2}.sc .sb{display:none}.sc.on .sf{display:none}.sc.on .sb{display:block;color:#14532d}.sc.on{border-style:solid;border-color:#16a34a;background:#f0fdf4}.sf{color:#78716c;font-weight:700}
.appfoot{text-align:center;font-size:13px;color:#57534e;padding:14px 8px 24px;border-top:1px solid #d6d3d1;margin-top:10px}
/* document (preview + print) */
.doc{font-size:11.5pt;color:#000;line-height:1.4}
.doc .dh{border:1.5px solid #000;padding:5px 8px;margin-bottom:6px}.doc .r{display:flex;justify-content:space-between;gap:10px;margin:3px 0;flex-wrap:wrap}
.doc .ln{display:inline-block;border-bottom:1px solid #000;min-width:30mm;height:1em}
.doc .dt{margin:4px 0 0;text-align:center;font-size:15pt}.doc .ds{text-align:center;font-size:10pt;margin-bottom:6px}
.doc .qh{font-weight:700;margin:9px 0 3px}.doc .qb{break-inside:avoid;margin:4px 0}
.doc .wl{border-bottom:1px solid #777;height:8mm}
.doc table.w{border-collapse:collapse;width:100%}.doc table.w th,.doc table.w td{border:1.2px solid #000;padding:3px 6px;text-align:left}.doc table.w th{background:#eee}
.doc .opts{display:grid;grid-template-columns:1fr 1fr;gap:1px 14px;margin:2px 0 0 18px}
.doc .key{background:none;border:0;border-top:2px dashed #000;border-radius:0;margin-top:12px;padding-top:6px}
.doc .a{color:#14532d;font-weight:700}
.doc pre{font:inherit;white-space:pre-wrap;margin:2px 0}
table.pg{width:100%;border-collapse:collapse}table.pg td{padding:0;border:0}
.sph,.spf{height:0}
#printHost{display:none}
.wmk,.pfoot{display:none}
@page{size:A4;margin:0}
@media print{
 body{background:#fff}
 .app{display:none!important}
 #printHost{display:block}
 #printHost .doc{padding:0 14mm}
 .sph{height:13mm}.spf{height:18mm}
 .wmk{display:block;position:fixed;left:0;right:0;top:46%;transform:translateY(-50%) rotate(-30deg);text-align:center;font-size:30pt;font-weight:700;line-height:1.3;color:#000;opacity:.08;z-index:-1;pointer-events:none;-webkit-print-color-adjust:exact;print-color-adjust:exact;white-space:nowrap}
 .wmk div:last-child{font-size:24pt}
 .pfoot{display:flex;justify-content:space-between;gap:10px;position:fixed;left:14mm;right:14mm;bottom:6mm;font-size:8.5pt;color:#333;border-top:1px solid #777;padding-top:2px;background:#fff}
}
</style>
