<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>अभ्यास मंच – शाळा</title>
<style>:root{--bg:#f7f7f4;--c:#fff;--i:#1f2933;--m:#64748b;--l:#e2e8f0;--a:#0f766e}@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--c:#1e293b;--i:#e2e8f0;--m:#94a3b8;--l:#334155}}
body{margin:0;background:var(--bg);color:var(--i);font:15px/1.5 system-ui,sans-serif}main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:14px;margin-bottom:14px}h1{font-size:20px;margin:6px 0 12px}h2{font-size:16px;margin:0 0 8px}
input,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--l);background:var(--c);color:var(--i);width:100%;box-sizing:border-box;margin-bottom:8px}
button{background:var(--a);color:#fff;border:0;cursor:pointer}button.g{background:var(--c);color:var(--a);border:1px solid var(--a)}button:disabled{opacity:.5}
.er{color:#b91c1c;min-height:18px}small,.m{color:var(--m)}.mod{display:flex;align-items:center;gap:12px;text-align:left;padding:14px;margin-bottom:10px}.mod span{font-size:26px}</style></head><body><main>
<h1>🏫 अभ्यास मंच – शाळा लॉगिन</h1>
<div id="x"></div></main>
<script>
var X=document.getElementById('x'),T='',SC='';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function api(u,b){b=b||{};b.token=T;return fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json().then(function(j){j.$s=r.status;return j})}).catch(function(){return{e:'net'}})}
function ss(k,v){try{if(v==null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v)}catch(e){}}
function sg(k){try{return sessionStorage.getItem(k)||''}catch(e){return ''}}
function loginUi(){X.innerHTML='<div class="card"><h2>लॉगिन</h2><input id="u" inputmode="numeric" maxlength="11" placeholder="शाळेचा UDISE कोड (११ अंकी)"><input id="p" type="password" placeholder="पासवर्ड"><input id="n" placeholder="आपले नाव (नोंद करणारे)"><p id="e" class="er"></p><button onclick="login()">लॉगिन करा</button><p class="m" style="font-size:13px">सुरुवातीचा पासवर्ड: 123456 (सुरक्षिततेसाठी नंतर बदलणे चांगले).</p><button class="g" onclick="forgotUi()">पासवर्ड विसरलात?</button></div>'}
function forgotUi(){X.innerHTML='<div class="card"><h2>पासवर्ड रीसेट विनंती</h2><input id="fu" inputmode="numeric" maxlength="11" placeholder="शाळेचा UDISE कोड"><input id="fn" placeholder="आपले नाव"><input id="fm" inputmode="numeric" maxlength="10" placeholder="आपला मोबाईल क्रमांक"><p id="e" class="er"></p><button onclick="forgot()">विनंती पाठवा</button><button class="g" onclick="loginUi()">मागे</button><p class="m" style="font-size:13px">प्रशासक तपासून पासवर्ड 123456 करतील; नंतर लॉगिन करून हवा तर बदला.</p></div>'}
function forgot(){var e=document.getElementById('e');api('/api/s/forgot',{udise:document.getElementById('fu').value,name:document.getElementById('fn').value,mobile:document.getElementById('fm').value}).then(function(j){if(j.ok){X.innerHTML='<div class="card"><h2>✅ विनंती पाठवली</h2><p>प्रशासकाने रीसेट केल्यावर पासवर्ड 123456 होईल. नंतर लॉगिन करा.</p><button onclick="loginUi()">लॉगिनकडे जा</button></div>'}else e.textContent='UDISE, नाव किंवा मोबाईल चुकीचा.'})}
function login(){var e=document.getElementById('e');e.textContent='';var nm=document.getElementById('n').value.trim();if(nm.length<2){e.textContent='आपले नाव लिहा.';return}
 api('/api/s/login',{udise:document.getElementById('u').value,pw:document.getElementById('p').value}).then(function(j){
  if(!j.ok){e.textContent=j.e==='locked'?'खूप चुकीचे प्रयत्न. प्रशासकाशी संपर्क करा.':j.e==='net'?'इंटरनेट तपासा.':'UDISE किंवा पासवर्ड चुकीचा.';return}
  T=j.token;SC=j.school;ss('am_s',T);ss('am_su',j.udise||'');ss('am_sn',nm);ss('am_ss',SC);T=j.token;home()})}
function chpwUi(force,old){X.innerHTML='<div class="card"><h2>'+(force?'नवीन पासवर्ड ठेवा':'पासवर्ड बदला')+'</h2>'+(force?'':'<input id="o" type="password" placeholder="सध्याचा पासवर्ड">')+'<input id="n1" type="password" placeholder="नवीन पासवर्ड (किमान ६ अक्षरे)"><input id="n2" type="password" placeholder="नवीन पासवर्ड पुन्हा"><p id="e" class="er"></p><button onclick="chpw('+(force?'1':'0')+')">जतन करा</button>'+(force?'':'<button class="g" onclick="home()">मागे</button>')+'</div>';window.OLD=old||''}
function chpw(force){var e=document.getElementById('e'),a=document.getElementById('n1').value,b=document.getElementById('n2').value,o=force?window.OLD:document.getElementById('o').value;
 if(a.length<6||a==='123456'){e.textContent='पासवर्ड किमान ६ अक्षरे व 123456 नसावा.';return}if(a!==b){e.textContent='दोन्ही पासवर्ड जुळत नाहीत.';return}
 api('/api/s/chpw',{old:o,nw:a}).then(function(j){if(j.ok)home();else e.textContent=j.e==='bad'?'सध्याचा पासवर्ड चुकीचा.':'जतन झाले नाही.'})}
var E=esc;
function rqf(f,i,v){var id='rq'+i,x=v==null?'':String(v),lb='<label>'+E(f.l)+(f.r?' *':'')+'</label>';if(f.t==='s')return lb+'<select id="'+id+'"><option value="">— निवडा —</option>'+f.o.map(function(o){return '<option'+(o===x?' selected':'')+'>'+E(o)+'</option>'}).join('')+'</select>';if(f.t==='y')return lb+'<select id="'+id+'"><option value="">— निवडा —</option><option'+(x==='हो'?' selected':'')+'>हो</option><option'+(x==='नाही'?' selected':'')+'>नाही</option></select>';if(f.t==='l')return lb+'<textarea id="'+id+'" rows="3" maxlength="1000" style="width:100%;box-sizing:border-box">'+E(x)+'</textarea>';return lb+'<input id="'+id+'" value="'+E(x)+'"'+(f.t==='n'?' inputmode="decimal"':'')+(f.t==='d'?' type="date"':'')+' style="width:100%;box-sizing:border-box">'}
function rqc(F){var o={};F.forEach(function(f,i){var e=document.getElementById('rq'+i);if(e)o['f'+i]=e.value.trim()});return o}
var RQL=null;
function dm(s){var m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?m[3]+'-'+m[2]+'-'+m[1]:(s||'')}
function rqUi(){X.innerHTML='<p class="m">लोड होत आहे…</p>';api('/api/s/reqs',{}).then(function(j){var h='<div class="card"><h2>📨 माहिती मागवली आहे</h2>';if(!j||!j.ok){X.innerHTML=h+'<p class="er">लोड झाले नाही.</p><button onclick="home()">← मागे</button></div>';return}RQL=j.rows;if(!j.rows.length)h+='<p>सध्या कोणतीही माहिती मागवलेली नाही.</p>';h+='</div>';j.rows.forEach(function(r,i){h+='<button class="g" style="text-align:left" onclick="rqO('+i+')">'+(r.mine?'✅ ':'🔔 ')+esc(r.title)+(r.due?' <small>(मुदत '+esc(dm(r.due))+')</small>':'')+(r.closed?' <small>· मुदत संपली</small>':'')+'</button>'});X.innerHTML=h+'<button class="g" onclick="home()">← मागे</button>'})}
function rqO(i){var r=RQL[i],h='<div class="card"><h2>'+esc(r.title)+'</h2>'+(r.due?'<small>अंतिम तारीख: '+esc(dm(r.due))+'</small>':'')+(r.mine?'<p><small>आधी भरले: '+esc(r.mine.ts)+' (बदलता येईल)</small></p>':'');r.f.forEach(function(f,k){h+=rqf(f,k,r.mine?r.mine.d['f'+k]:'')});h+=(r.closed?'<p class="er">मुदत संपली आहे.</p>':'<p id="rqe" class="er"></p><button onclick="rqP('+i+')">📤 सादर करा</button>')+'</div><button class="g" onclick="rqUi()">← मागे</button>';X.innerHTML=h;if(r.closed)Array.prototype.forEach.call(X.querySelectorAll('input,select,textarea'),function(e){e.disabled=true})}
function rqP(i){var r=RQL[i];api('/api/s/reqsub',{id:r.id,data:rqc(r.f)}).then(function(j){if(j&&j.ok)rqUi();else{var m={req:'हा रकाना आवश्यक आहे: ',num:'संख्या लिहा: ',date:'तारीख निवडा: ',opt:'पर्याय निवडा: ',closed:'मुदत संपली.'}[j&&j.e]||'पाठवता आले नाही.';document.getElementById('rqe').textContent=m+((j&&j.l)||'')}})}
function home(){X.innerHTML='<div class="card"><h2>'+esc(sg('am_ss')||SC)+'</h2><small>नमस्कार, '+esc(sg('am_sn'))+'</small></div><button class="g mod" onclick="location.href=\'pm.html\'"><span>🍲</span><b>PM पोषण आहार</b></button><button class="g mod" onclick="commUi()"><span>👥</span><b>शाळास्तरीय समित्या</b></button><button class="g mod" onclick="distUi(\'uni\')"><span>🎽</span><b>गणवेश वाटप</b></button><button class="g mod" onclick="formUi()"><span>📋</span><b>शाळा माहिती</b></button><button class="g mod" onclick="rqUi()"><span>📨</span><b>माहिती मागवली आहे</b></button><button class="g mod" onclick="distUi(\'book\')"><span>📚</span><b>पुस्तक वाटप</b></button><button class="g mod" onclick="distUi(\'shoe\')"><span>👟</span><b>बूट व मोजे वाटप</b></button><button class="g mod" onclick="distUi(\'bag\')"><span>🎒</span><b>शालेय दप्तर वाटप</b></button><div class="card"><small>इतर शाळा-स्तरीय माहिती लवकरच येथे जोडली जाईल.</small></div><button class="g" onclick="chpwUi(false)">🔑 पासवर्ड बदला (ऐच्छिक)</button><button class="g" onclick="out()">बाहेर पडा</button>'}

var CM=null,CI=0,DES=['अध्यक्ष','उपाध्यक्ष','सचिव','सदस्य सचिव','सदस्य'],TYP=['पालक','शिक्षक','मुख्याध्यापक','ग्रामपंचायत प्रतिनिधी','महिला प्रतिनिधी','माजी विद्यार्थी','तज्ञ / इतर'];
function opts(a,v){return '<option value="">— निवडा —</option>'+a.map(function(x){return '<option'+(x===v?' selected':'')+'>'+esc(x)+'</option>'}).join('')}
function commUi(){X.innerHTML='<p class="m">लोड होत आहे…</p>';api('/api/s/comm',{}).then(function(j){if(!j.ok){X.innerHTML='<div class="card"><p class="er">लोड झाले नाही.</p><button onclick="home()">मागे</button></div>';return}CM=j.committees;CI=0;commDraw('')})}
function commDraw(msg){var c=CM[CI];X.innerHTML='<button class="g" onclick="home()">← मागे</button><div class="card"><h2>👥 शाळास्तरीय समित्या</h2><div style="display:flex;gap:6px;flex-wrap:wrap">'+CM.map(function(x,i){return '<button class="'+(i===CI?'':'g')+'" style="width:auto;margin:0 0 6px" onclick="CI='+i+';commDraw(\'\')">'+esc(x.name)+' ('+x.members.length+')</button>'}).join('')+'</div></div><div class="card"><h2>'+esc(c.name)+'</h2>'+(c.members.length?c.members.map(function(m,i){return '<div style="border-top:1px solid var(--l);padding:8px 0"><input placeholder="सदस्याचे नाव" value="'+esc(m.name)+'" oninput="CM[CI].members['+i+'].name=this.value"><select onchange="CM[CI].members['+i+'].desig=this.value" style="width:100%;box-sizing:border-box;padding:10px;margin-bottom:8px;border-radius:10px;border:1px solid var(--l);background:var(--c);color:var(--i)">'+opts(DES,m.desig)+'</select><select onchange="CM[CI].members['+i+'].type=this.value" style="width:100%;box-sizing:border-box;padding:10px;margin-bottom:8px;border-radius:10px;border:1px solid var(--l);background:var(--c);color:var(--i)">'+opts(TYP,m.type)+'</select><input inputmode="numeric" maxlength="10" placeholder="मोबाईल" value="'+esc(m.mobile)+'" oninput="CM[CI].members['+i+'].mobile=this.value"><input type="date" value="'+esc(m.joined)+'" onchange="CM[CI].members['+i+'].joined=this.value"><label style="font-size:13px"><input type="checkbox" style="width:auto;margin-right:6px"'+(m.active!=='No'?' checked':'')+' onchange="CM[CI].members['+i+'].active=this.checked?\'Yes\':\'No\'">सध्या कार्यरत</label> <button class="g" style="width:auto;padding:4px 10px;margin:0 0 0 8px" onclick="commDel('+i+')">🗑️ काढा</button></div>'}).join(''):'<p class="m">अजून सदस्य नाहीत.</p>')+'<button class="g" onclick="commAdd()">＋ सदस्य जोडा</button><p id="cm" class="'+(msg&&msg[0]==='✓'?'':'er')+'">'+esc(msg)+'</p><button onclick="commSave()">💾 जतन करा</button></div>'}
function commAdd(){CM[CI].members.push({name:'',desig:'',type:'',mobile:'',joined:'',active:'Yes'});commDraw('')}
function commDel(i){if(!confirm('हा सदस्य काढायचा? (जतन केल्यावर कायमचा काढला जाईल)'))return;CM[CI].members.splice(i,1);commDraw('')}
function commSave(){var c=CM[CI];for(var i=0;i<c.members.length;i++){var m=c.members[i];if(!String(m.name||'').trim()){commDraw('सदस्य '+(i+1)+': नाव लिहा.');return}if(m.mobile&&!/^\d{10}$/.test(String(m.mobile).replace(/\s/g,''))){commDraw('सदस्य '+(i+1)+': मोबाईल १० अंकी असावा.');return}}
 api('/api/s/commsave',{id:c.id,members:c.members}).then(function(j){commDraw(j.ok?'✓ जतन झाले ('+j.n+' सदस्य)':'जतन झाले नाही.')})}

var DK='uni',DR=[],DC='',BK={},BKD={};function medOf(c){var m={};DR.forEach(function(r){if(String(r.cls)===String(c)){var k=r.med==='kn'?'kn':'mr';m[k]=(m[k]||0)+1}});return (m.kn||0)>(m.mr||0)?'kn':'mr'}function bkOf(c){return BK[c]||((BKD[c]||{})[medOf(c)])||[]}var KC={uni:['गणवेश वाटप','🎽',['शर्ट / टॉप','पँट'],'(नग)'],shoe:['बूट व मोजे वाटप','👟',['बूट','मोजे'],'(जोड)'],bag:['शालेय दप्तर वाटप','🎒'],book:['पुस्तक वाटप','📚']};function ub(){return !!KC[DK][2]}function dT(){return KC[DK][0]}function dI(){return KC[DK][1]}
var SEL='width:100%;box-sizing:border-box;padding:10px;margin-bottom:8px;border-radius:10px;border:1px solid var(--l);background:var(--c);color:var(--i)';
function today(){return new Date(Date.now()+19800000).toISOString().slice(0,10)}
function distUi(k){DK=k;X.innerHTML='<p class="m">विद्यार्थी लोड होत आहेत…</p>';api('/api/s/dist',{kind:k}).then(function(j){if(!j.ok){X.innerHTML='<div class="card"><p class="er">लोड झाले नाही.</p><button onclick="home()">मागे</button></div>';return}DR=j.rows.map(function(r){r.got=r.got?1:0;r.date=r.date||'';r.sz1=ub()?(r.sz1||'1'):'';r.sz2=ub()?(r.sz2||'1'):'';r.o=r.got;r.od=r.date;r.o1=r.sz1;r.o2=r.sz2;return r});DC='';BK={};if(DK!=='book'){distDraw('');return}fetch('data/books.json').then(function(x){return x.json()}).catch(function(){return {}}).then(function(d){BKD=d;return api('/api/s/books',{})}).then(function(q){(q.rows||[]).forEach(function(x){try{BK[x.cls]=JSON.parse(x.names)}catch(e){}});distDraw('')})})}
function distKeys(){var s={};DR.forEach(function(r){s[r.cls+'|'+r.div]=1});return Object.keys(s).sort(function(a,b){var x=a.split('|'),y=b.split('|');return (+x[0]-+y[0])||(x[1]<y[1]?-1:1)})}
function distDraw(msg){var ks=distKeys();if(!DR.length){X.innerHTML='<button class="g" onclick="home()">← मागे</button><div class="card"><h2>'+dI()+' '+dT()+'</h2><p class="m">या शाळेची विद्यार्थी-यादी अजून नाही. शिक्षकांनी विद्यार्थी नोंदणी/आयात केल्यावर ती येथे दिसेल.</p></div>';return}
