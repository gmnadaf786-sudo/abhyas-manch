<script>

var WK=['रवि','सोम','मंगळ','बुध','गुरु','शुक्र','शनि'],MN=['जानेवारी','फेब्रुवारी','मार्च','एप्रिल','मे','जून','जुलै','ऑगस्ट','सप्टेंबर','ऑक्टोबर','नोव्हेंबर','डिसेंबर'];
function pn(n){return String(n).replace(/\d/g,function(d){return '०१२३४५६७८९'[d]})}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

function recFor(date){var p=date.split('-'),d=new Date(+p[0],+p[1]-1,+p[2],12),A=new Date(2026,5,15,12);var diff=Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(2026,5,15))/86400000),w=Math.floor(diff/7);if(w<0)w=0;return RECIPES[(w%2===0?0:6)+d.getDay()-1]||RECIPES[0]}
function fyOf(m){var y=+m.slice(0,4),mo=+m.slice(5,7);return mo>=4?y:y-1}

function pulseNorm(x){x=String(x||'').split('/')[0].trim();if(x==='वाटाणा')x='हिरवा वाटाणा';if(x==='आख्खा मूग')x='मूग';return x}

 var n=new Date(Date.now()+19800000);MON=n.toISOString().slice(0,7);load()}

 X.innerHTML='<div class="tabs">'+t.map(function(x){return '<button class="'+(TAB===x[0]?'on':'')+'" onclick="TAB=\''+x[0]+'\';draw()">'+x[1]+'</button>'}).join('')+'</div>'+

function dTab(){var p=MON.split('-'),y=+p[0],m=+p[1]-1,last=new Date(y,m+1,0).getDate(),td=today(),h='';
 for(var d=1;d<=last;d++){var dt=new Date(y,m,d,12);if(dt.getDay()===0)continue;var date=ymd(dt),fut=date>td,e=ent(date),dirty=!!E[date];
  h+='<div class="day'+(fut?' dim':'')+'" id="d'+date+'"><div class="dh"><b>'+pn(d)+' '+MN[m]+' · '+WK[dt.getDay()]+'</b><span>'+(SD[date]&&!dirty?'<span class="chip">जतन</span>':'')+(dirty?'<span class="chip" style="background:#fef3c7;color:#92400e">बदल</span>':'')+'</span></div>'+
  '<div class="r"><select onchange="dset(\''+date+'\',\'cooked\',this.value,1)"><option value="होय"'+(e.cooked==='होय'?' selected':'')+'>आहार शिजवला</option><option value="नाही"'+(e.cooked==='नाही'?' selected':'')+'>शिजवला नाही / सुट्टी</option></select></div>';
  if(e.cooked==='होय'){h+='<span class="lab">मेनू</span><select class="n" onchange="dmenu(\''+date+'\',this.value)">'+(MENUS.indexOf(e.menu)<0&&e.menu?'<option selected>'+esc(e.menu)+'</option>':'')+MENUS.map(function(x){return '<option'+(x===e.menu?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select>'+
   '<div class="r"><div><span class="lab">इ. १–५ उपस्थिती</span><input class="n" type="number" inputmode="numeric" min="0" value="'+esc(e.p15)+'" oninput="dset(\''+date+'\',\'p15\',this.value)"></div><div><span class="lab">इ. ६–८ उपस्थिती</span><input class="n" type="number" inputmode="numeric" min="0" value="'+esc(e.p68)+'" oninput="dset(\''+date+'\',\'p68\',this.value)"></div></div>'+

   '<details style="margin-top:6px"><summary class="m">चव / वाटप / शेरा</summary><div class="r"><div><span class="lab">चव घेतल्याची वेळ</span><input class="n" type="time" value="'+esc(e.tasteTime)+'" onchange="dset(\''+date+'\',\'tasteTime\',this.value)"></div><div><span class="lab">वाटप वेळ</span><input class="n" type="time" value="'+esc(e.distTime)+'" onchange="dset(\''+date+'\',\'distTime\',this.value)"></div></div><span class="lab">चव घेणारे</span><input class="n" value="'+esc(e.taster)+'" oninput="dset(\''+date+'\',\'taster\',this.value)"><span class="lab">शेरा</span><input class="n" value="'+esc(e.remark)+'" oninput="dset(\''+date+'\',\'remark\',this.value)"><span class="lab">पूरक आहार</span><input class="n" value="'+esc(e.supplement)+'" oninput="dset(\''+date+'\',\'supplement\',this.value)"><label style="display:block;margin-top:6px"><input type="checkbox"'+(e.sample==='होय'?' checked':'')+' onchange="dset(\''+date+'\',\'sample\',this.checked?\'होय\':\'\')"> नमुना ठेवला</label></details>'}
  if(SD[date])h+='<div style="margin-top:6px"><button class="d" style="padding:5px 10px" onclick="ddel(\''+date+'\')">नोंद रद्द</button></div>';
  h+='</div>'}
 document.getElementById('b').innerHTML='<div class="card">'+h+'</div><div class="sv"><p id="e" class="er"></p><button onclick="dsave()">💾 सर्व बदल जतन करा</button></div>'}
function popt(sel){return '<option value="">—</option>'+PULSES.map(function(x){return '<option'+(x===sel?' selected':'')+'>'+esc(x)+'</option>'}).join('')}
function dset(date,k,v,redraw){var e=E[date]||(E[date]=ent(date));e[k]=v;if(!e.d){e.d=1}if(redraw){var y=window.scrollY;dTab();window.scrollTo(0,y)}else{var c=document.querySelector('#d'+date+' .chip');}}

 post('/api/pm/savemonth',{month:MON,entries:es}).then(function(j){if(j.ok){load()}else{er.className='er';er.textContent=({future:'पुढील तारखेची नोंद करता येत नाही.',pres:'किमान एका गटाची उपस्थिती भरा.',menu:'मेनू निवडा.',num:'उपस्थिती संख्या चुकीची.',net:'इंटरनेट अडचण.'})[j.e]?({future:'पुढील तारखेची नोंद करता येत नाही.',pres:'किमान एका गटाची उपस्थिती भरा.',menu:'मेनू निवडा.',num:'उपस्थिती संख्या चुकीची.',net:'इंटरनेट अडचण.'})[j.e]+(j.m?' ('+j.m+')':''):'जतन झाले नाही. पुन्हा प्रयत्न करा.'}})}

 Y.daily.concat(Object.keys(E).map(function(k){return null})).forEach(function(r){if(!r||r.date.slice(0,7)!==month||r.cooked==='नाही')return;var n=g==='15'?r.p15:r.p68;if(!n)return;

function sread(){var d={};document.querySelectorAll('#b .st input').forEach(function(el){var v=el.value.trim();if(v==='')return;var it=ITEMS[+el.dataset.i];(d[it]=d[it]||{})[el.dataset.k]=Number(v)});var pt=document.getElementById('pat').value.trim();if(pt!=='')d._pat={o:Number(pt)};return d}
function srecalc(){var d=sread(),u=usedFor(MON,GRP),ms=fyMonths(fyOf(MON)),idx=ms.indexOf(MON),prev=idx>0?closing(ms[idx-1],GRP):null;ITEMS.forEach(function(it,i){var e=d[it]||{},o=e.o!=null?e.o:(prev?prev[it]:0),cl=(o||0)+(e.r||0)+(e.p||0)-u[it],c=document.getElementById('sc'+i);c.innerHTML='<b>'+fmt(cl)+'</b>';c.className=cl<-0.0005?'neg':''})}
function sfill(){var rc=rcptTotals(MON);document.querySelectorAll('#b .st input[data-k="r"]').forEach(function(el){var it=ITEMS[+el.dataset.i];if(rc[it])el.value=rc[it]});srecalc()}
function ssave(){var d=sread(),er=document.getElementById('e');er.className='m';er.textContent='जतन होत आहे…';post('/api/pm/stocksave',{month:MON,grp:GRP,data:d}).then(function(j){if(j.ok){SD2[MON+'|'+GRP]=d;load()}else{er.className='er';er.textContent='जतन झाले नाही ('+(j.m||j.e||'')+')'}})}
/* ---------- पावती ---------- */
function rcptTotals(m){var t={};(Y.rcpt||[]).forEach(function(r){if(r.date.slice(0,7)!==m)return;var it=[];try{it=JSON.parse(r.items)}catch(e){}it.forEach(function(x){t[x.name]=Math.round(((t[x.name]||0)+x.qty)*1e4)/1e4})});return t}
var RE=null;
function rTab(){var list=(Y.rcpt||[]).filter(function(r){return r.date.slice(0,7)===MON}),tot=rcptTotals(MON);
 var h='<div class="card"><h2>🧾 धान्य आवक (पावत्या) – '+MN[+MON.slice(5,7)-1]+'</h2>'+(list.length?list.map(function(r){var it=[];try{it=JSON.parse(r.items)}catch(e){}return '<div class="day"><div class="dh"><b>'+esc(r.date)+' · '+esc(r.supplier)+'</b><span><button class="g" style="padding:4px 9px" onclick="redit(\''+r.id+'\')">बदला</button> <button class="d" style="padding:4px 9px" onclick="rdel(\''+r.id+'\')">काढा</button></span></div><small>चलन: '+esc(r.challan||'—')+'</small><div>'+it.map(function(x){return esc(x.name)+' '+fmt(x.qty)}).join(' · ')+'</div></div>'}).join(''):'<p class="m">या महिन्यात पावती नाही.</p>')+'</div>'+
 (Object.keys(tot).length?'<div class="card"><h2>महिन्याची एकूण आवक</h2>'+Object.keys(tot).map(function(k){return esc(k)+' <b>'+fmt(tot[k])+'</b>'}).join(' · ')+'</div>':'')+
 '<div id="rf"></div><div class="sv"><button onclick="radd()">➕ नवीन पावती</button></div>';document.getElementById('b').innerHTML=h}
function radd(){RE={id:'',date:today(),supplier:'',challan:'',remark:'',items:[{name:'तांदूळ',qty:''}]};rform()}
function redit(id){var r=Y.rcpt.filter(function(x){return x.id===id})[0],it=[];try{it=JSON.parse(r.items)}catch(e){}RE={id:id,date:r.date,supplier:r.supplier,challan:r.challan,remark:r.remark,items:it.map(function(x){return{name:x.name,qty:x.qty}})};rform()}
function rform(){var h='<div class="card"><h2>'+(RE.id?'पावती बदला':'नवीन पावती')+'</h2><span class="lab">तारीख</span><input class="n" type="date" max="'+today()+'" value="'+RE.date+'" onchange="RE.date=this.value"><span class="lab">कोणाकडून (पुरवठादार)</span><input class="n" value="'+esc(RE.supplier)+'" oninput="RE.supplier=this.value"><span class="lab">चलन क्रमांक</span><input class="n" value="'+esc(RE.challan)+'" oninput="RE.challan=this.value"><span class="lab">जिन्नस (किग्रॅ / लि.)</span>'+
 RE.items.map(function(x,i){return '<div class="r" style="margin-bottom:6px"><select style="flex:2" onchange="RE.items['+i+'].name=this.value">'+ITEMS.map(function(n){return '<option'+(n===x.name?' selected':'')+'>'+esc(n)+'</option>'}).join('')+'</select><input type="number" step="any" min="0" placeholder="प्रमाण" value="'+esc(x.qty)+'" oninput="RE.items['+i+'].qty=this.value"><button class="d" style="flex:0 0 40px;padding:8px 0" onclick="RE.items.splice('+i+',1);rform()">✕</button></div>'}).join('')+
 '<button class="g" onclick="RE.items.push({name:\'तांदूळ\',qty:\'\'});rform()">+ जिन्नस</button><span class="lab">शेरा</span><input class="n" value="'+esc(RE.remark)+'" oninput="RE.remark=this.value"><p id="re" class="er"></p><div class="r"><button onclick="rsave()">💾 जतन करा</button><button class="g" onclick="RE=null;document.getElementById(\'rf\').innerHTML=\'\'">रद्द</button></div></div>';
 document.getElementById('rf').innerHTML=h;document.getElementById('rf').scrollIntoView()}
function rsave(){post('/api/pm/rsave',{id:RE.id,date:RE.date,supplier:RE.supplier,challan:RE.challan,remark:RE.remark,items:RE.items.map(function(x){return{name:x.name,qty:Number(x.qty)}})}).then(function(j){var e=document.getElementById('re');if(j.ok){RE=null;load()}else e.textContent=({date:'तारीख चुकीची.',supplier:'पुरवठादार भरा.',items:'किमान एक जिन्नस व प्रमाण भरा.'})[j.e]||'जतन झाले नाही.'})}
function rdel(id){if(!confirm('ही पावती काढायची?'))return;post('/api/pm/rdel',{id:id}).then(function(j){if(j.ok)load();else alert('अयशस्वी')})}
