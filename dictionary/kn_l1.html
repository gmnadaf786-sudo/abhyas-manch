<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ನನ್ನ ಮೊದಲ ಇಂಗ್ಲಿಷ್–ಕನ್ನಡ ಶಬ್ದಕೋಶ</title>
<style>
:root{
  --bg:#fff8e7; --card:#ffffff; --ink:#2b2b3a; --muted:#6b7280; --brand:#e8590c; --brand2:#2563eb;
  --line:#f1e0b8; --soft:#fff1cc; --ok:#16a34a; --bad:#dc2626;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans Kannada","Nirmala UI","Tunga","Kedage",system-ui,sans-serif;line-height:1.55;font-size:16px}
.wrap{max-width:780px;margin:0 auto;padding:0 14px 40px}
header{background:linear-gradient(135deg,#e8590c,#f59e0b);color:#fff;padding:18px 14px 14px;border-radius:0 0 22px 22px;box-shadow:0 4px 14px rgba(232,89,12,.3)}
header .in{max-width:780px;margin:0 auto}
header h1{margin:0;font-size:1.35rem;line-height:1.3}
header p{margin:4px 0 0;font-size:.92rem;opacity:.95}
.letters{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 6px}
.letters a,.letters span{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-weight:700;font-family:system-ui,sans-serif;text-decoration:none;font-size:.95rem}
.letters .on{background:var(--brand);color:#fff;box-shadow:0 2px 6px rgba(232,89,12,.45)}
.letters a.ready{background:#fff;color:var(--brand);border:2px solid var(--brand)}
.letters .soon{background:#f3ead2;color:#b8aa84}
.hint{font-size:.8rem;color:var(--muted);margin:12px 0 10px}
.tabs{display:flex;gap:8px;margin:10px 0}
.tabs button{flex:1;border:2px solid var(--brand);background:#fff;color:var(--brand);padding:10px;border-radius:14px;font:inherit;font-weight:700;cursor:pointer}
.tabs button.act{background:var(--brand);color:#fff}
.tools{display:flex;gap:8px;margin-bottom:10px}
.tools input{flex:1;padding:11px 14px;border-radius:14px;border:2px solid var(--line);font:inherit;background:#fff;min-width:0}
.tools input:focus{outline:none;border-color:var(--brand)}
.tools button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:0 12px;font:inherit;cursor:pointer;color:var(--ink)}
.count{font-size:.85rem;color:var(--muted);margin:0 2px 8px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden}
.card .top{display:flex;gap:12px;padding:10px;cursor:pointer;align-items:center}
.pic{width:84px;height:84px;flex:none;background:var(--soft);border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pic svg{width:100%;height:100%}
.emo{font-size:2.8rem;line-height:1;font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}
.game .big .emo{font-size:5rem}
.pic img{max-width:100%;max-height:100%;object-fit:contain;mix-blend-mode:multiply}
.pic.wide{width:130px}
.info{flex:1;min-width:0}
.en{font-size:1.3rem;font-weight:800;font-family:Georgia,"Times New Roman",serif;color:var(--brand2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pr{font-size:.9rem;color:var(--muted)}
.mean{font-weight:700;font-size:1.02rem;margin-top:2px}
.say{border:none;background:var(--soft);border-radius:50%;width:34px;height:34px;font-size:1rem;cursor:pointer}
.say:active{transform:scale(.9)}
.forms{font-size:.85rem;color:var(--brand2);margin-top:2px;font-family:Georgia,serif}
.chev{font-size:.8rem;color:var(--muted);flex:none;transition:transform .2s}
.card.open .chev{transform:rotate(180deg)}
.more{display:none;border-top:2px dashed var(--line);padding:8px 14px 12px;background:#fffdf6}
.card.open .more{display:block}
.sense{margin:8px 0}
.sense .k{font-weight:800}
.sense .num{display:inline-block;background:var(--brand);color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;font-size:.8rem;line-height:22px;margin-right:6px;font-family:system-ui,sans-serif}
.ex{margin:5px 0 0 28px;padding-left:10px;border-left:4px solid #fbbf24}
.ex .e{font-family:Georgia,serif;font-size:1rem}
.ex .e b{color:var(--brand2)}
.ex .t{font-size:.95rem}
.ex .t b{color:var(--brand)}
.note{margin-top:8px;background:#e0f2fe;border-radius:10px;padding:6px 10px;font-size:.88rem}
.see{display:inline-block;border:2px solid var(--brand2);border-radius:8px;padding:0 8px;font-family:Georgia,serif;font-weight:700;color:var(--brand2);margin-top:6px}
.empty{text-align:center;color:var(--muted);padding:30px 0}
.game{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px;text-align:center}
.game .q{font-weight:700;margin-bottom:8px}
.game .big{width:150px;height:150px;margin:6px auto 10px;background:var(--soft);border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.game .big svg{width:100%;height:100%}
.game .big img{max-width:100%;max-height:100%;mix-blend-mode:multiply}
.game .word{font-family:Georgia,serif;font-size:1.9rem;font-weight:800;color:var(--brand2);margin:14px 0 10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.opts button{padding:12px 8px;border-radius:14px;border:2px solid var(--line);background:#fff;font:inherit;font-weight:700;cursor:pointer;min-height:52px}
.opts button.ok{background:#dcfce7;border-color:var(--ok)}
.opts button.no{background:#fee2e2;border-color:var(--bad)}
.opts button:disabled{cursor:default}
.prog{font-size:.85rem;color:var(--muted);margin-bottom:6px}
.next{margin-top:12px;border:none;background:var(--brand);color:#fff;border-radius:14px;padding:10px 22px;font:inherit;font-weight:700;cursor:pointer}
.result{font-size:1.2rem;font-weight:800;padding:14px 0}
footer{margin-top:22px;text-align:center;font-size:.8rem;color:var(--muted);line-height:1.7}
footer b{color:var(--ink)}
@media (max-width:420px){.pic{width:72px;height:72px}.pic.wide{width:110px}.en{font-size:1.15rem}}
</style>
</head>

const WORDS = Object.entries(DATA).flatMap(([l,a])=>a.map(x=>{x.L=l;return x;}));
let CUR = 'A';

/* ---------- ಸಹಾಯಕ ---------- */
const $ = id => document.getElementById(id);
const plain = h => h.replace(/<[^>]+>/g,'');
function picHTML(x){
  if(x.emo) return `<span class="emo" role="img" aria-label="${x.w}">${x.emo}</span>`;
  if(x.crop) return `<img src="${CROP[x.crop]}" alt="${x.w}">`;
  if(!x.pic||!PIC[x.pic]) return `<span class="emo" style="font-family:Georgia,serif;color:#e8590c;font-weight:800">${x.w[0].toUpperCase()}</span>`;
  return `<svg viewBox="0 0 100 100" role="img" aria-label="${x.w}">${PIC[x.pic]}</svg>`;
}
function say(text){
  try{
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-IN'; u.rate = .8;
    const v = speechSynthesis.getVoices().find(v=>/en[-_]IN/i.test(v.lang)) || speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang));
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- ಅಕ್ಷರ ಪಟ್ಟಿ ---------- */
function drawLetters(){
  let h='';
  for(const c of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'){
    if(!DATA[c]) h+=`<span class="soon">${c}</span>`;
    else h+=`<a href="#" class="${c===CUR?'on':'ready'}" data-l="${c}">${c}</a>`;
  }
  $('letters').innerHTML=h;
}
$('letters').addEventListener('click',e=>{
  const a=e.target.closest('a[data-l]'); if(!a) return;
  e.preventDefault(); CUR=a.dataset.l; $('q').value=''; allOpen=false; drawLetters(); render(); window.scrollTo({top:0});
});
$('hint').textContent='ಬೂದು ಬಣ್ಣದ ಅಕ್ಷರಗಳ ಪದಗಳು ಶೀಘ್ರದಲ್ಲಿ ಬರಲಿವೆ. ಪದದ ಮೇಲೆ ಒತ್ತಿದರೆ ಪೂರ್ಣ ವಿವರ ಕಾಣಿಸುತ್ತದೆ. ಹುಡುಕಿದಾಗ ಎಲ್ಲಾ ಅಕ್ಷರಗಳಲ್ಲೂ ಹುಡುಕುತ್ತದೆ.';

/* ---------- ಪದಗಳ ಪಟ್ಟಿ ---------- */
function card(x,i){
  const first = x.s[0];
  const meanShort = first.k;
  const senses = x.s.map((s,n)=>{
    const ex = s.e.map(([e,t])=>`<div class="ex"><div class="e">${e}</div><div class="t">${t}</div></div>`).join('');
    return `<div class="sense"><div class="k">${x.s.length>1?`<span class="num">${n+1}</span>`:''}${s.k}</div>${ex}</div>`;
  }).join('');
  const see = x.see ? `<div><span class="see">${x.see} ನೋಡಿ</span></div>`:'';
  const note = x.note ? `<div class="note">💡 ${x.note}</div>`:'';
  return `<div class="card" data-i="${i}">
    <div class="top">
      <div class="pic ${x.wide?'wide':''}">${picHTML(x)}</div>
      <div class="info">
        <div class="en">${x.w}${x.sup?`<sup>${x.sup}</sup>`:''}<button class="say" data-say="${x.w.split(' / ')[0]}" aria-label="ಉಚ್ಚಾರ ಕೇಳು">🔊</button></div>
        <div class="pr">( ${x.p} )</div>
        ${x.f?`<div class="forms">${x.f}</div>`:''}
        <div class="mean">${meanShort}</div>
      </div>
      <div class="chev">▼</div>
    </div>
    <div class="more">${senses}${see}${note}</div>
  </div>`;
}
function render(){
  const q = $('q').value.trim().toLowerCase();
  const items = WORDS.map((x,i)=>({x,i})).filter(({x})=>{
    if(!q) return x.L===CUR;
    const hay = (x.w+' '+(x.f||'')+' '+x.s.map(s=>s.k+' '+s.e.map(e=>plain(e[0])+' '+plain(e[1])).join(' ')).join(' ')).toLowerCase();
    return hay.includes(q);
  });
  $('count').textContent = (q?'ಎಲ್ಲಾ ಅಕ್ಷರಗಳಲ್ಲಿ ':'ಅಕ್ಷರ '+CUR+' : ') + items.length + ' ಪದಗಳು';
  $('list').innerHTML = items.length ? items.map(({x,i})=>card(x,i)).join('') : '<div class="empty">ಯಾವುದೇ ಪದ ಸಿಗಲಿಲ್ಲ 🔍</div>';
}
$('q').addEventListener('input',render);
$('list').addEventListener('click',e=>{
  const b = e.target.closest('.say');
  if(b){ e.stopPropagation(); say(b.dataset.say); return; }
  const c = e.target.closest('.card'); if(c) c.classList.toggle('open');
});
var allOpen=false;
$('toggleAll').addEventListener('click',()=>{
  allOpen=!allOpen;
  document.querySelectorAll('#list .card').forEach(c=>c.classList.toggle('open',allOpen));
});
drawLetters();
render();

/* ---------- ಟ್ಯಾಬ್ ---------- */
function tab(g){
  $('viewW').style.display = g?'none':'block';
  $('viewG').style.display = g?'block':'none';
  $('tabW').classList.toggle('act',!g);
  $('tabG').classList.toggle('act',g);
  if(g) startGame();
}
$('tabW').onclick=()=>tab(false);
$('tabG').onclick=()=>tab(true);

/* ---------- ಆಟ ---------- */
const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
let G;
function startGame(){
  const pool = WORDS.filter(x=>x.game);
  const qs = shuffle(pool).slice(0,10);
  G = {qs, n:0, score:0, pool};
  question();
}
function question(){
  if(G.n>=G.qs.length){
    const pct = Math.round(G.score/G.qs.length*100);
    $('game').innerHTML = `<div class="game"><div class="result">${G.score} / ${G.qs.length} ${pct>=80?'🏆 ಅದ್ಭುತ!':pct>=50?'👍 ಚೆನ್ನಾಗಿದೆ!':'💪 ಇನ್ನೊಮ್ಮೆ ಪ್ರಯತ್ನಿಸಿ!'}</div><button class="next" id="again">ಮತ್ತೆ ಆಡು</button></div>`;
    $('again').onclick=startGame; return;
  }
  const x = G.qs[G.n];
  const others = shuffle(G.pool.filter(o=>o!==x)).slice(0,3);
  const mode = Math.random()<.5 ? 'pic' : 'kn';
  let html = `<div class="game"><div class="prog">ಪ್ರಶ್ನೆ ${G.n+1} / ${G.qs.length} · ಅಂಕ ${G.score}</div>`;
  let opts;
  if(mode==='pic'){
    html += `<div class="q">ಈ ಚಿತ್ರಕ್ಕೆ ಹೊಂದುವ ಇಂಗ್ಲಿಷ್ ಪದ ಯಾವುದು?</div><div class="big">${picHTML(x)}</div>`;
    opts = shuffle([x,...others]).map(o=>({t:o.w,ok:o===x}));
  }else{
    html += `<div class="q">ಈ ಪದದ ಕನ್ನಡ ಅರ್ಥ ಯಾವುದು?</div><div class="word">${x.w} <button class="say" data-say="${x.w}">🔊</button></div>`;
    opts = shuffle([x,...others]).map(o=>({t:o.s[0].k.split(/[,(]/)[0].trim(),ok:o===x}));
  }
  html += `<div class="opts">${opts.map((o,i)=>`<button data-ok="${o.ok?1:0}">${o.t}</button>`).join('')}</div><div id="fb"></div></div>`;
  $('game').innerHTML = html;
}
$('game').addEventListener('click',e=>{
  const s = e.target.closest('.say'); if(s){ say(s.dataset.say); return; }
  const b = e.target.closest('.opts button'); if(!b) return;
  const btns = [...document.querySelectorAll('.opts button')];
  btns.forEach(x=>{ x.disabled=true; if(x.dataset.ok==='1') x.classList.add('ok'); });
  if(b.dataset.ok==='1'){ G.score++; $('fb').innerHTML='<div class="result" style="color:var(--ok)">✔ ಸರಿ!</div>'; }
  else { b.classList.add('no'); $('fb').innerHTML='<div class="result" style="color:var(--bad)">✘ ತಪ್ಪು</div>'; }
  $('fb').innerHTML += `<button class="next" id="nx">${G.n+1>=G.qs.length?'ಫಲಿತಾಂಶ':'ಮುಂದೆ ▶'}</button>`;
  $('nx').onclick=()=>{ G.n++; question(); };
});
if('speechSynthesis' in window) speechSynthesis.getVoices();
</script>
