name: Build book covers
on:
  workflow_dispatch:
  push:
    paths: ['covers/list.tsv', '.github/workflows/covers.yml']
permissions:
  contents: write
jobs:
  covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils webp
      - name: Render first page of each book
        run: |
          set -u
          ok=0; bad=0
          while IFS=$'\t' read -r path out; do
            [ -z "$path" ] && continue
            enc=$(python3 -c 'import sys,urllib.parse;print("/".join(urllib.parse.quote(x) for x in sys.argv[1].split("/")))' "$path")
            mkdir -p "$(dirname "$out")"
            if curl -sfL --retry 3 "https://books-cdn.gmnadaf786.workers.dev/$enc" -o book.pdf \
               && pdftoppm -f 1 -l 1 -singlefile -png -scale-to-x 360 -scale-to-y -1 book.pdf page \
               && cwebp -quiet -q 70 page.png -o "$out"; then ok=$((ok+1)); echo "OK  $out"; else bad=$((bad+1)); echo "ERR $path"; fi
            rm -f book.pdf page.png
          done < covers/list.tsv
          echo "done ok=$ok bad=$bad"
      - name: Commit covers
        run: |
          git config user.name "covers-bot"
          git config user.email "actions@users.noreply.github.com"
          git add covers
          git diff --cached --quiet || (git commit -m "Add book cover thumbnails" && git pull --rebase && git push)
